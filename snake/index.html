<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JuniorABC — 音節蛇</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a202c;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ── Top bar ─────────────────────────────────────── */
    .top-bar {
      width: 100%;
      max-width: 800px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 4px;
    }
    .back-home {
      color: #90cdf4;
      text-decoration: none;
      font-size: 14px;
    }
    .back-home:hover { color: #bee3f8; }
    .bucket-tag {
      font-size: 12px;
      background: #2d3748;
      border: 1px solid #4a5568;
      border-radius: 4px;
      padding: 2px 8px;
      color: #a0aec0;
    }
    .tts-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .tts-btn:hover { background: #2d3748; }

    /* ── Question area ───────────────────────────────── */
    .question-area {
      width: 100%;
      max-width: 800px;
      padding: 4px 16px 8px;
      text-align: center;
    }
    .zh-meaning {
      font-size: 24px;
      font-weight: 700;
      color: #f6e05e;
      min-height: 34px;
      margin-bottom: 8px;
    }
    .collected-slots {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      min-height: 38px;
      align-items: center;
    }
    .syl-slot {
      background: #2d3748;
      border: 2px solid #4a5568;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 14px;
      min-width: 38px;
      text-align: center;
      color: #718096;
      transition: border-color 0.2s;
    }
    .syl-slot.filled {
      border-color: #48bb78;
      color: #e2e8f0;
    }

    /* ── Syllable colour classes (match flashcard) ───── */
    .syl-stress { color: #4299e1; font-weight: 700; }
    .syl-silent { color: #fc8181; text-decoration: line-through;
                  text-decoration-color: #fc8181; }
    .syl-dot    { color: #718096; }

    /* ── Grid ────────────────────────────────────────── */
    .grid-wrapper {
      overflow-x: auto;
      padding: 0 16px;
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .game-grid {
      display: grid;
      gap: 2px;
      background: #2d3748;
      border: 2px solid #4a5568;
      border-radius: 8px;
      padding: 2px;
      flex-shrink: 0;
    }
    .cell {
      background: #1a202c;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      line-height: 1;
      user-select: none;
    }
    .cell.snake-head { background: #48bb78; }
    .cell.snake-body { background: #276749; }
    .cell.food {
      background: #1e3a5f;
      border: 1px solid #2c5282;
    }

    /* ── Footer ──────────────────────────────────────── */
    .footer {
      width: 100%;
      max-width: 800px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      gap: 8px;
    }
    .score-area {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }
    .hearts {
      font-size: 16px;
      letter-spacing: 1px;
      flex: 1;
      text-align: center;
    }
    .help-btn {
      background: #744210;
      color: #fefcbf;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .help-btn:hover:not(:disabled) { background: #975a16; }
    .help-btn:disabled {
      background: #2d3748;
      color: #718096;
      cursor: default;
    }

    /* ── D-pad ───────────────────────────────────────── */
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(2, 52px);
      gap: 4px;
      justify-content: center;
      padding: 8px 0 12px;
    }
    .dpad-btn {
      background: #2d3748;
      border: 2px solid #4a5568;
      border-radius: 10px;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .dpad-btn:active { background: #4a5568; }

    /* ── Overlays ─────────────────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .overlay-card {
      background: #2d3748;
      border-radius: 16px;
      padding: 32px 40px;
      text-align: center;
      max-width: 360px;
      width: 90%;
    }
    .overlay-title { font-size: 30px; font-weight: 900; margin-bottom: 10px; }
    .overlay-sub   { font-size: 14px; color: #a0aec0; margin-bottom: 22px; line-height: 1.7; }
    .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn-primary {
      background: #4299e1; color: white; border: none;
      border-radius: 10px; padding: 11px 28px;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .btn-primary:hover { background: #3182ce; }
    .btn-secondary {
      background: #4a5568; color: white; border: none;
      border-radius: 10px; padding: 11px 28px;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .btn-secondary:hover { background: #718096; }
  </style>
</head>
<body>

  <!-- Start screen -->
  <div class="overlay" id="startScreen">
    <div class="overlay-card">
      <div class="overlay-title">音節蛇 🐍</div>
      <div class="overlay-sub">
        看中文 → 在格子裡找出對應的音節 → 按<strong style="color:#f6e05e">順序</strong>吃完<br>
        吃錯 10 次遊戲結束<br>
        用「幫幫我」清掉雜音節，但只得 0.5 分
      </div>
      <div id="startInfo" style="font-size:13px;color:#718096;margin-bottom:18px"></div>
      <div class="btn-row">
        <button class="btn-primary" onclick="startGame()">開始遊戲</button>
      </div>
      <br>
      <a href="../" style="color:#718096;font-size:13px">← 主選單</a>
    </div>
  </div>

  <!-- Game over screen -->
  <div class="overlay" id="gameOverScreen" hidden>
    <div class="overlay-card">
      <div class="overlay-title" id="goTitle">遊戲結束</div>
      <div class="overlay-sub" id="goSub"></div>
      <div class="btn-row">
        <button class="btn-primary"   onclick="restartGame()">再玩一次</button>
        <button class="btn-secondary" onclick="location.href='../'">主選單</button>
      </div>
    </div>
  </div>

  <!-- Main UI -->
  <div class="top-bar">
    <a href="../" class="back-home">← 主選單</a>
    <span class="bucket-tag" id="bucketTag"></span>
    <button class="tts-btn" id="ttsBtn" onclick="speakWord()" title="播放發音">🔊</button>
  </div>

  <div class="question-area">
    <div class="zh-meaning" id="zhMeaning">—</div>
    <div class="collected-slots" id="collectedSlots"></div>
  </div>

  <div class="grid-wrapper">
    <div class="game-grid" id="gameGrid"></div>
  </div>

  <div class="footer">
    <div class="score-area">分數：<span id="scoreDisplay">0</span></div>
    <div class="hearts" id="heartsDisplay"></div>
    <button class="help-btn" id="helpBtn" onclick="useHelp()" disabled>幫幫我</button>
  </div>

  <div class="dpad" id="dpad">
    <div></div>
    <button class="dpad-btn" onclick="setDir(0,-1)">▲</button>
    <div></div>
    <button class="dpad-btn" onclick="setDir(-1,0)">◀</button>
    <button class="dpad-btn" onclick="setDir(0, 1)">▼</button>
    <button class="dpad-btn" onclick="setDir( 1,0)">▶</button>
  </div>

<script>
// ── Constants ───────────────────────────────────────────────────────────────
const SCHOOL_YEAR = '114';
const TICK_MS     = 160;   // snake speed
const TTS_MS      = 5000;  // TTS repeat interval
const MAX_WRONG   = 10;
const FOOD_COUNT  = 22;    // food items on grid at once
const MAX_SNAKE   = 12;    // cap snake length

// ── Dynamic grid dims (set in buildGridDOM) ──────────────────────────────────
let GRID_COLS = 14;
let GRID_ROWS = 10;
let CELL_SIZE = 40;

// ── Vocab data ───────────────────────────────────────────────────────────────
let VOCAB      = [];
let keepWords  = [];
let currentBucket = '7.1';

// ── Game state ────────────────────────────────────────────────────────────────
let snake   = [];          // [{x,y}], head first
let dir     = {x:1, y:0};
let nextDir = {x:1, y:0};

// food: Map "x,y" → {wordIdx, sylIdx, block, rendered}
let food = new Map();

let targetWordIdx   = -1;
let targetSylBlocks = [];
let collectedIdx    = 0;
let usedHelp        = false;
let wrongCount      = 0;
let score           = 0;
let answeredIndices = new Set();

let gameRunning  = false;
let transitioning = false;
let loopTimer    = null;
let ttsTimer     = null;

// cached DOM cells: key → element
let cellEls      = {};
let prevCellState = {};

// ── Syllable rendering (matches flashcard) ───────────────────────────────────
function renderSylBlock(part) {
  const stripped = part.replace(/\[[^\]]*\]/g, '');
  const stressed = /[A-Z]/.test(stripped);

  let inner = '';
  let last  = 0;
  const re  = /\[([A-Za-z]+)\]/g;
  let m;
  while ((m = re.exec(part)) !== null) {
    const before = part.slice(last, m.index);
    if (before) inner += before.toLowerCase();
    inner += `<span class="syl-silent">${m[1].toLowerCase()}</span>`;
    last = m.index + m[0].length;
  }
  inner += part.slice(last).toLowerCase();

  return stressed ? `<span class="syl-stress">${inner}</span>` : inner;
}

function renderSyl(syl) {
  if (!syl) return '';
  const dot = '<span class="syl-dot">·</span>';
  return syl.split('·').map(renderSylBlock).join(dot);
}

// Split syl string → individual block tokens (split by · AND space)
function getSylBlocks(wordObj) {
  if (!wordObj.syl) return [wordObj.word.toUpperCase()];
  return wordObj.syl.split(/[·\s]+/).filter(b => b.length > 0);
}

// ── Grid helpers ──────────────────────────────────────────────────────────────
function key(x, y) { return `${x},${y}`; }

function snakeSet() {
  const s = new Set();
  snake.forEach(p => s.add(key(p.x, p.y)));
  return s;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function getFreeCells(count) {
  const occupied = snakeSet();
  food.forEach((_, k) => occupied.add(k));
  const free = [];
  for (let y = 0; y < GRID_ROWS; y++)
    for (let x = 0; x < GRID_COLS; x++)
      if (!occupied.has(key(x, y))) free.push({x, y});
  shuffle(free);
  return free.slice(0, count);
}

// ── Food management ───────────────────────────────────────────────────────────
function buildFoodSet() {
  food.clear();

  // All target syllables first
  const items = targetSylBlocks.map((block, si) => ({
    wordIdx: targetWordIdx, sylIdx: si, block
  }));

  // Fill rest with random syllables from other words
  const others = keepWords
    .map((w, i) => ({w, i}))
    .filter(({i}) => i !== targetWordIdx);
  shuffle(others);

  for (const {w, i} of others) {
    if (items.length >= FOOD_COUNT) break;
    const blocks = getSylBlocks(w);
    const si = Math.floor(Math.random() * blocks.length);
    items.push({wordIdx: i, sylIdx: si, block: blocks[si]});
  }

  shuffle(items);
  const cells = getFreeCells(items.length);
  items.forEach(({wordIdx, sylIdx, block}, idx) => {
    if (idx >= cells.length) return;
    const {x, y} = cells[idx];
    food.set(key(x, y), {wordIdx, sylIdx, block, rendered: renderSylBlock(block)});
  });
}

function spawnDistractor(count = 1) {
  const others = keepWords
    .map((w, i) => ({w, i}))
    .filter(({i}) => i !== targetWordIdx);
  shuffle(others);

  const newItems = [];
  for (const {w, i} of others) {
    if (newItems.length >= count) break;
    const blocks = getSylBlocks(w);
    const si = Math.floor(Math.random() * blocks.length);
    newItems.push({wordIdx: i, sylIdx: si, block: blocks[si]});
  }

  const cells = getFreeCells(newItems.length);
  newItems.forEach(({wordIdx, sylIdx, block}, idx) => {
    if (idx >= cells.length) return;
    const {x, y} = cells[idx];
    food.set(key(x, y), {wordIdx, sylIdx, block, rendered: renderSylBlock(block)});
  });
}

function respawnTargetSyl(sylIdx, block) {
  const cells = getFreeCells(1);
  if (!cells.length) return;
  const {x, y} = cells[0];
  food.set(key(x, y), {
    wordIdx: targetWordIdx, sylIdx, block, rendered: renderSylBlock(block)
  });
}

function useHelp() {
  if (!gameRunning || usedHelp) return;
  usedHelp = true;
  const btn = document.getElementById('helpBtn');
  btn.disabled = true;
  btn.textContent = '已使用 (×0.5)';

  // Remove all non-target syllables
  for (const [k, item] of food.entries()) {
    if (item.wordIdx !== targetWordIdx) food.delete(k);
  }
  render();
}

// ── Target word ───────────────────────────────────────────────────────────────
function pickNextWord() {
  let available = keepWords.map((_, i) => i).filter(i => !answeredIndices.has(i));
  if (available.length === 0) {
    answeredIndices.clear();
    available = keepWords.map((_, i) => i);
  }

  targetWordIdx   = available[Math.floor(Math.random() * available.length)];
  targetSylBlocks = getSylBlocks(keepWords[targetWordIdx]);
  collectedIdx    = 0;
  usedHelp        = false;

  const btn = document.getElementById('helpBtn');
  btn.disabled    = false;
  btn.textContent = '幫幫我';

  document.getElementById('zhMeaning').textContent = keepWords[targetWordIdx].zh;
  updateCollectedSlots();
  buildFoodSet();
  startTtsTimer();
}

function updateCollectedSlots() {
  const el = document.getElementById('collectedSlots');
  el.innerHTML = targetSylBlocks.map((b, i) =>
    i < collectedIdx
      ? `<span class="syl-slot filled">${renderSylBlock(b)}</span>`
      : `<span class="syl-slot">＿</span>`
  ).join('');
}

// ── Snake ──────────────────────────────────────────────────────────────────────
function initSnake() {
  const mx = Math.floor(GRID_COLS / 2);
  const my = Math.floor(GRID_ROWS / 2);
  snake   = [{x:mx, y:my}, {x:mx-1, y:my}, {x:mx-2, y:my}];
  dir     = {x:1, y:0};
  nextDir = {x:1, y:0};
}

function moveSnake() {
  dir = {...nextDir};
  const head = snake[0];
  const nx   = (head.x + dir.x + GRID_COLS) % GRID_COLS;
  const ny   = (head.y + dir.y + GRID_ROWS) % GRID_ROWS;
  const k    = key(nx, ny);
  const newHead = {x: nx, y: ny};

  if (food.has(k)) {
    const item = food.get(k);
    food.delete(k);

    const isCorrect = item.wordIdx === targetWordIdx && item.sylIdx === collectedIdx;

    if (isCorrect) {
      snake.unshift(newHead);
      if (snake.length > MAX_SNAKE) snake.pop();
      collectedIdx++;
      updateCollectedSlots();

      if (collectedIdx === targetSylBlocks.length) {
        onWordComplete();
        return;
      }
    } else {
      // Wrong — move without growing
      snake.unshift(newHead);
      snake.pop();
      onWrongSyllable();

      // Put syllable back (target → keep in place; distractor → new distractor)
      if (item.wordIdx === targetWordIdx) {
        respawnTargetSyl(item.sylIdx, item.block);
      } else {
        spawnDistractor(1);
      }
    }
  } else {
    snake.unshift(newHead);
    snake.pop();
  }
}

// ── Game events ────────────────────────────────────────────────────────────────
function onWordComplete() {
  transitioning = true;
  answeredIndices.add(targetWordIdx);
  score += usedHelp ? 0.5 : 1;
  updateScore();

  setTimeout(() => {
    initSnake();
    pickNextWord();
    render();
    transitioning = false;
  }, 700);
}

function onWrongSyllable() {
  wrongCount++;
  updateHearts();
  if (wrongCount >= MAX_WRONG) endGame();
}

function updateScore() {
  document.getElementById('scoreDisplay').textContent =
    Number.isInteger(score) ? score : score.toFixed(1);
}

function updateHearts() {
  const rem = MAX_WRONG - wrongCount;
  document.getElementById('heartsDisplay').textContent =
    '❤️'.repeat(Math.max(rem, 0)) + '🖤'.repeat(Math.min(wrongCount, MAX_WRONG));
}

// ── TTS ────────────────────────────────────────────────────────────────────────
function speakWord() {
  if (!keepWords[targetWordIdx]) return;
  const u = new SpeechSynthesisUtterance(keepWords[targetWordIdx].word);
  u.lang = 'en-US';
  u.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function startTtsTimer() {
  stopTtsTimer();
  speakWord();
  ttsTimer = setInterval(speakWord, TTS_MS);
}

function stopTtsTimer() {
  if (ttsTimer) { clearInterval(ttsTimer); ttsTimer = null; }
  speechSynthesis.cancel();
}

// ── Game flow ──────────────────────────────────────────────────────────────────
function startGame() {
  document.getElementById('startScreen').hidden = true;
  wrongCount = 0; score = 0; answeredIndices.clear();
  updateScore(); updateHearts();
  buildGridDOM();
  initSnake();
  pickNextWord();
  gameRunning = true;
  loopTimer   = setInterval(tick, TICK_MS);
}

function restartGame() {
  document.getElementById('gameOverScreen').hidden = true;
  wrongCount = 0; score = 0; answeredIndices.clear();
  updateScore(); updateHearts();
  buildGridDOM();
  initSnake();
  food.clear();
  pickNextWord();
  gameRunning = true;
  loopTimer   = setInterval(tick, TICK_MS);
}

function endGame() {
  gameRunning = false;
  clearInterval(loopTimer); loopTimer = null;
  stopTtsTimer();

  document.getElementById('goTitle').textContent = '遊戲結束！';
  document.getElementById('goSub').innerHTML =
    `共答對 <strong style="color:#f6e05e;font-size:22px">${
      Number.isInteger(score) ? score : score.toFixed(1)
    }</strong> 題`;
  document.getElementById('gameOverScreen').hidden = false;
}

// ── Render ─────────────────────────────────────────────────────────────────────
function buildGridDOM() {
  const grid  = document.getElementById('gameGrid');
  const avail = Math.min(window.innerWidth - 24, 760);
  CELL_SIZE   = Math.max(34, Math.min(50, Math.floor(avail / GRID_COLS)));

  const gridW = CELL_SIZE * GRID_COLS + 2 * (GRID_COLS - 1) + 4; // gap + padding
  grid.style.gridTemplateColumns = `repeat(${GRID_COLS}, ${CELL_SIZE}px)`;
  grid.style.width = `${gridW}px`;

  grid.innerHTML = '';
  cellEls = {}; prevCellState = {};

  for (let y = 0; y < GRID_ROWS; y++) {
    for (let x = 0; x < GRID_COLS; x++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.width  = `${CELL_SIZE}px`;
      cell.style.height = `${CELL_SIZE}px`;
      cell.style.fontSize = `${Math.max(10, CELL_SIZE - 28)}px`;
      grid.appendChild(cell);
      cellEls[key(x, y)] = cell;
    }
  }
}

function render() {
  const ss      = snakeSet();
  const headKey = snake.length ? key(snake[0].x, snake[0].y) : null;

  for (const k in cellEls) {
    let state;
    if (k === headKey)  state = 'head';
    else if (ss.has(k)) state = 'body';
    else if (food.has(k)) state = 'food:' + food.get(k).block;
    else state = '';

    if (prevCellState[k] === state) continue;
    prevCellState[k] = state;

    const cell = cellEls[k];
    if (state === 'head') {
      cell.className = 'cell snake-head';
      cell.innerHTML = '';
    } else if (state === 'body') {
      cell.className = 'cell snake-body';
      cell.innerHTML = '';
    } else if (state.startsWith('food:')) {
      cell.className = 'cell food';
      cell.innerHTML = food.get(k).rendered;
    } else {
      cell.className = 'cell';
      cell.innerHTML = '';
    }
  }
}

function tick() {
  if (!gameRunning || transitioning) return;
  moveSnake();
  render();
}

// ── Input ──────────────────────────────────────────────────────────────────────
function setDir(dx, dy) {
  if (!gameRunning) return;
  // Prevent 180° reversal
  if (dx !== -dir.x || dy !== -dir.y) nextDir = {x:dx, y:dy};
}

const KEY_MAP = {
  ArrowUp:    [0,-1], ArrowDown: [0,1],
  ArrowLeft: [-1, 0], ArrowRight:[1,0],
  w:[0,-1], s:[0,1], a:[-1,0], d:[1,0],
};

document.addEventListener('keydown', e => {
  const d = KEY_MAP[e.key];
  if (!d) return;
  e.preventDefault();
  setDir(d[0], d[1]);
});

// Touch swipe
let touchOrigin = null;
document.addEventListener('touchstart', e => {
  touchOrigin = {x: e.touches[0].clientX, y: e.touches[0].clientY};
}, {passive: true});
document.addEventListener('touchend', e => {
  if (!touchOrigin) return;
  const dx = e.changedTouches[0].clientX - touchOrigin.x;
  const dy = e.changedTouches[0].clientY - touchOrigin.y;
  touchOrigin = null;
  if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
  else setDir(0, dy > 0 ? 1 : -1);
}, {passive: true});

// ── Init ───────────────────────────────────────────────────────────────────────
(async () => {
  const params = new URLSearchParams(location.search);
  currentBucket = params.get('bucket') || '7.1';

  const LABELS = {
    '7.1':'國一上','7.2':'國一下','8.1':'國二上','8.2':'國二下',
  };
  const label = LABELS[currentBucket] || currentBucket;
  document.getElementById('bucketTag').textContent   = label;
  document.getElementById('startInfo').textContent   = `資料集：${label}`;

  try {
    const res  = await fetch(`../flashcard/data/${SCHOOL_YEAR}.${currentBucket}.json`);
    const data = await res.json();
    VOCAB      = data.words;
    keepWords  = VOCAB.filter(w => w.diff === 'keep');
    buildGridDOM();
  } catch {
    document.getElementById('startScreen').innerHTML =
      '<div class="overlay-card" style="color:#fc8181">資料載入失敗，請重新整理</div>';
  }
})();
</script>
