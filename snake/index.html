<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JuniorABC — 音節蛇</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    button:not(:disabled):active { filter: brightness(.92); }
    [hidden] { display: none !important; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f5fc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ── Top bar ─────────────────────────────────────── */
    .top-bar {
      width: 100%;
      max-width: 800px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 4px;
    }
    .back-home {
      font-size: 14px; font-weight: 600;
      color: #2563eb; background: none;
      border: 1px solid #bfdbfe; border-radius: 20px;
      padding: 6px 14px; min-height: 36px; cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .back-home:hover { color: #1d4ed8; border-color: #93c5fd; }
    .bucket-tag {
      font-size: 12px;
      background: #dde8f8;
      border: 1px solid #93c5fd;
      border-radius: 4px;
      padding: 2px 8px;
      color: #1e40af;
    }
    .tts-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      padding: 6px 10px;
      min-height: 38px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .tts-btn:hover { background: #dde8f8; }

    /* ── Question area ───────────────────────────────── */
    .question-area {
      width: 100%;
      max-width: 800px;
      padding: 4px 16px 8px;
      text-align: center;
    }
    .zh-meaning {
      font-size: 24px;
      font-weight: 700;
      color: #92400e;
      min-height: 34px;
      margin-bottom: 8px;
    }
    .collected-slots {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      min-height: 38px;
      align-items: center;
    }
    .syl-slot {
      background: #e8f0fb;
      border: 2px solid #94a3b8;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 14px;
      min-width: 38px;
      text-align: center;
      color: #94a3b8;
      transition: border-color 0.2s;
    }
    .syl-slot.filled {
      border-color: #16a34a;
      color: #1e293b;
    }

    /* ── Syllable colour classes (match flashcard) ───── */
    .syl-stress { color: #1d4ed8; font-weight: 700; }
    .syl-silent { color: #dc2626; text-decoration: line-through;
                  text-decoration-color: #dc2626; }
    .syl-dot    { color: #6b7280; }

    /* ── Grid ────────────────────────────────────────── */
    .grid-wrapper {
      overflow-x: auto;
      padding: 0 16px;
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .game-grid {
      display: grid;
      gap: 1px;
      background: #94a3b8;
      border: 2px solid #64748b;
      border-radius: 8px;
      padding: 2px;
      flex-shrink: 0;
    }
    .cell {
      background: #e8f0fb;
      border-radius: 3px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      line-height: 1;
      user-select: none;
    }

    /* ── Snake head ──────────────────────────────────── */
    .cell.snake-head {
      background: radial-gradient(circle at 38% 32%, #d1fae5, #16a34a 68%);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(74,222,128,.6),
                  inset 0 -3px 5px rgba(0,0,0,.18);
    }
    /* Eyes: pupil(dark) → sclera(white) → outline(dark) */
    .cell.snake-head::before,
    .cell.snake-head::after {
      content: '';
      position: absolute;
      width: 25%;
      height: 25%;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(0,0,0,.9) 0%, rgba(0,0,0,.9) 35%,
        #fff           35%, #fff           68%,
        rgba(0,0,0,.5) 68%);
    }
    .cell.snake-head[data-dir="r"]::before { top: 18%; right: 14%; }
    .cell.snake-head[data-dir="r"]::after  { bottom: 18%; right: 14%; }
    .cell.snake-head[data-dir="l"]::before { top: 18%; left: 14%; }
    .cell.snake-head[data-dir="l"]::after  { bottom: 18%; left: 14%; }
    .cell.snake-head[data-dir="d"]::before { bottom: 14%; left: 18%; }
    .cell.snake-head[data-dir="d"]::after  { bottom: 14%; right: 18%; }
    .cell.snake-head[data-dir="u"]::before { top: 14%; left: 18%; }
    .cell.snake-head[data-dir="u"]::after  { top: 14%; right: 18%; }

    /* ── Snake body ──────────────────────────────────── */
    .cell.snake-body {
      background: linear-gradient(145deg, #86efac, #22c55e 55%, #15803d);
      border-radius: 5px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.3),
                  0 1px 3px rgba(0,0,0,.1);
    }
    /* sheen highlight on each segment */
    .cell.snake-body::after {
      content: '';
      position: absolute;
      width: 38%; height: 28%;
      top: 12%; left: 26%;
      background: rgba(255,255,255,.24);
      border-radius: 50%;
      pointer-events: none;
    }

    /* ── Snake tail (diamond) ────────────────────────── */
    .cell.snake-tail {
      background: linear-gradient(135deg, #86efac 0%, #22c55e 45%, #15803d 100%);
      border-radius: 5px;
      transform: scale(0.52) rotate(45deg);
      box-shadow: 0 2px 5px rgba(0,0,0,.22);
    }

    /* ── Food gems ───────────────────────────────────── */
    @keyframes foodGlow {
      0%,100% { box-shadow: 0 2px 7px rgba(37,99,235,.4),
                             inset 0 1px 0 rgba(255,255,255,.28); }
      50%     { box-shadow: 0 2px 16px rgba(99,102,241,.7),
                             inset 0 1px 0 rgba(255,255,255,.28); }
    }
    .cell.food {
      background: linear-gradient(145deg, #93c5fd, #3b82f6 48%, #1d4ed8);
      border: none;
      border-radius: 10px;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,.22);
      animation: foodGlow 2.5s ease-in-out infinite;
    }
    .cell.food .syl-stress { color: #bfdbfe; }
    .cell.food .syl-silent { color: #fca5a5; text-decoration-color: #fca5a5; }

    .cell.safe-border { background: #bfdbfe; }

    /* ── Wrong-syllable feedback ────────────────────────── */
    @keyframes gridShake {
      0%,100% { transform: translateX(0); }
      15%  { transform: translateX(-9px); }
      30%  { transform: translateX(9px); }
      50%  { transform: translateX(-6px); }
      68%  { transform: translateX(6px); }
      84%  { transform: translateX(-3px); }
    }
    .grid-wrapper.wrong-shake { animation: gridShake 0.42s ease; }

    @keyframes wrongPopup {
      0%   { opacity: 1; transform: translateY(0) scale(1.2); }
      50%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-56px) scale(0.85); }
    }
    .wrong-popup {
      position: fixed;
      pointer-events: none;
      font-size: 19px;
      font-weight: 900;
      color: #dc2626;
      text-shadow: 0 1px 4px rgba(0,0,0,.22);
      animation: wrongPopup 0.9s ease forwards;
      z-index: 500;
      white-space: nowrap;
      line-height: 1;
    }

    /* ── Corner hints (shown during celebrating) ────────── */
    @keyframes cornerPulse {
      0%, 100% {
        background: #fef3c7;
        box-shadow: 0 0 6px rgba(245,158,11,.55);
      }
      50% {
        background: #fbbf24;
        box-shadow: 0 0 18px rgba(245,158,11,.95), inset 0 0 6px rgba(255,255,255,.4);
      }
    }
    .cell.corner-hint {
      animation: cornerPulse 0.75s ease-in-out infinite;
      border-radius: 6px;
      font-size: 14px !important;
      line-height: 1;
    }
    /* ↗ symbol via ::before — stays centred regardless of cell size */
    .cell.corner-hint::before {
      content: '★';
      position: absolute;
      font-size: 60%;
      opacity: .75;
    }

    /* ── Footer ──────────────────────────────────────── */
    .footer {
      width: 100%;
      max-width: 800px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      gap: 8px;
    }
    .score-area {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }
    .hearts {
      font-size: 16px;
      letter-spacing: 1px;
      flex: 1;
      text-align: center;
    }
    .help-btn {
      background: #f59e0b;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      min-height: 40px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .help-btn:hover:not(:disabled) { background: #d97706; }
    .help-btn:disabled {
      background: #e2e8f0;
      color: #94a3b8;
      cursor: default;
    }

    /* ── D-pad ───────────────────────────────────────── */
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(2, 52px);
      gap: 4px;
      justify-content: center;
      padding: 8px 0 12px;
    }
    .dpad-btn {
      background: #dde8f8;
      border: 2px solid #94a3b8;
      border-radius: 10px;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .dpad-btn:active { background: #94a3b8; }

    /* ── Overlays ─────────────────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .overlay-card {
      background: #f8fafc;
      border-radius: 16px;
      padding: 32px 40px;
      text-align: center;
      max-width: 360px;
      width: 90%;
    }
    .overlay-title { font-size: 30px; font-weight: 900; margin-bottom: 10px; color: #1e293b; }
    .overlay-sub   { font-size: 14px; color: #475569; margin-bottom: 22px; line-height: 1.7; }
    .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn-primary {
      background: #2563eb; color: white; border: none;
      border-radius: 10px; padding: 11px 28px;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary {
      background: #64748b; color: white; border: none;
      border-radius: 10px; padding: 11px 28px;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .btn-secondary:hover { background: #94a3b8; }

    /* ── Speed selector ─────────────────────────────────── */
    .speed-selector { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }
    .speed-btn {
      background: #dde8f8; color: #1e293b;
      border: 2px solid transparent; border-radius: 8px;
      padding: 9px 18px; min-height: 40px;
      font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .speed-btn.speed-selected { border-color: #2563eb; background: #bfdbfe; color: #1d4ed8; }

    /* ── Difficulty selector (start screen) ─────────────── */
    .diff-group { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .diff-btn {
      padding: 13px 16px; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; cursor: pointer; text-align: left;
      transition: transform .1s, opacity .15s;
    }
    .diff-btn:active { transform: scale(.97); }
    .diff-keep { background: #dbeafe; color: #1e40af; }
    .diff-keep:hover { background: #bfdbfe; }
    .diff-easy { background: #dcfce7; color: #166534; }
    .diff-easy:hover { background: #bbf7d0; }
    .diff-all  { background: #ede9fe; color: #4c1d95; }
    .diff-all:hover  { background: #ddd6fe; }
    .diff-info { font-size: 12px; opacity: .72; margin-top: 3px; font-weight: 500; }
    .rec-row {
      font-size: 11px; color: #94a3b8; text-align: center;
      margin-top: -6px; letter-spacing: .3px;
    }
    .clear-rec-btn {
      margin-top: 4px; background: none;
      border: 1px solid #e2e8f0; border-radius: 18px;
      padding: 8px 16px; min-height: 36px;
      font-size: 11px; color: #94a3b8; cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .clear-rec-btn:hover { color: #dc2626; border-color: #dc2626; }

    /* ── Footer ── */
    .site-footer {
      margin-top: auto; padding-top: 12px;
      border-top: 1px solid #e2e8f0;
      width: 100%; max-width: 800px;
      text-align: center;
      font-size: 11px; color: #a0aec0; line-height: 1.9;
    }
    .site-footer > div:first-child { margin-top: 16px; }
    .site-footer a { color: #a0aec0; text-decoration: none; }
    .site-footer a:hover { color: #4299e1; }

    /* ── Game meta bar (progress + timer) ─────────────── */
    .game-meta {
      display: flex; justify-content: center; gap: 16px;
      font-size: 12px; color: #64748b;
      min-height: 16px; margin-bottom: 2px;
    }

    /* ── Quit button ─────────────────────────────────── */
    .quit-btn {
      background: none; border: 1px solid #94a3b8;
      border-radius: 6px; color: #64748b;
      font-size: 12px; font-weight: 600;
      padding: 8px 14px; min-height: 36px; cursor: pointer;
    }
    .quit-btn:hover { border-color: #dc2626; color: #dc2626; }

    /* ── Touch-device adjustments: cancel sticky :hover ── */
    @media (hover: none) {
      .back-home:hover { color: #2563eb; border-color: #bfdbfe; }
      .tts-btn:hover { background: transparent; }
      .help-btn:hover:not(:disabled) { background: #f59e0b; }
      .btn-primary:hover { background: #2563eb; }
      .btn-secondary:hover { background: #64748b; }
      .diff-keep:hover { background: #dbeafe; }
      .diff-easy:hover { background: #dcfce7; }
      .diff-all:hover { background: #ede9fe; }
      .clear-rec-btn:hover { color: #94a3b8; border-color: #e2e8f0; }
      .quit-btn:hover { color: #64748b; border-color: #94a3b8; }
    }
  </style>
</head>
<body>

  <!-- Start screen -->
  <div class="overlay" id="startScreen">
    <div class="overlay-card" style="max-height:92dvh;overflow-y:auto;padding:24px 28px;">
      <div class="overlay-title">音節蛇 🐍</div>
      <div class="overlay-sub" style="margin-bottom:14px;">
        看中文 → 找出<strong style="color:#92400e">全部</strong>音節依序吃完即可過關<br>
        <span style="color:#16a34a">重點單字＋音節≥2＋依序＋無錯誤 → 補 1 滴血</span><br>
        吃到無關音節 -1 血，歸零遊戲結束<br>
        「幫幫我」清掉雜音節，過關只得 0.5 分
      </div>
      <div id="startInfo" style="font-size:13px;color:#475569;margin-bottom:12px;"></div>
      <div style="font-size:13px;color:#64748b;margin-bottom:6px;">速度選擇</div>
      <div class="speed-selector">
        <button class="speed-btn" data-speed="slow"   onclick="selectSpeed('slow')">慢</button>
        <button class="speed-btn speed-selected" data-speed="medium" onclick="selectSpeed('medium')">中</button>
        <button class="speed-btn" data-speed="fast"   onclick="selectSpeed('fast')">快</button>
      </div>
      <div style="font-size:13px;color:#64748b;margin-bottom:8px;">難度選擇</div>
      <div class="diff-group">
        <button class="diff-btn diff-keep" onclick="startGame('keep')">
          重點單字
          <div class="diff-info">難度較高，符合條件可補血</div>
        </button>
        <div class="rec-row" id="snake-rec-keep">—</div>
        <button class="diff-btn diff-easy" onclick="startGame('easy')">
          熟悉單字
          <div class="diff-info">基礎單字，不補血</div>
        </button>
        <div class="rec-row" id="snake-rec-easy">—</div>
        <button class="diff-btn diff-all" onclick="startGame('all')">
          混合模式
          <div class="diff-info">全部單字混合出題</div>
        </button>
        <div class="rec-row" id="snake-rec-all">—</div>
        <button class="clear-rec-btn" onclick="clearSnakeRecords()">清除本冊記錄</button>
      </div>
      <br>
      <button class="back-home" style="font-size:13px;color:#64748b;border-color:#e2e8f0;" onclick="location.href='../'">← 主選單</button>
    </div>
  </div>

  <!-- Game over screen -->
  <div class="overlay" id="gameOverScreen" hidden>
    <div class="overlay-card">
      <div class="overlay-title" id="goTitle">遊戲結束</div>
      <div class="overlay-sub" id="goSub"></div>
      <div class="btn-row">
        <button class="btn-primary"   onclick="restartGame()">再玩一次</button>
        <button class="btn-secondary" onclick="location.href='../'">主選單</button>
      </div>
    </div>
  </div>

  <!-- Main UI -->
  <div class="top-bar">
    <button class="back-home" onclick="location.href='../'">← 主選單</button>
    <span class="bucket-tag" id="bucketTag"></span>
    <button class="quit-btn" id="quitBtn" onclick="quitGame()" hidden>我不玩了</button>
    <button class="tts-btn" id="ttsBtn" onclick="speakWord()" title="播放發音">🔊</button>
  </div>

  <div class="question-area">
    <div class="game-meta" id="gameMeta">
      <span id="progressDisplay"></span>
      <span id="timerDisplay"></span>
    </div>
    <div class="zh-meaning" id="zhMeaning">—</div>
    <div class="collected-slots" id="collectedSlots"></div>
  </div>

  <div class="grid-wrapper">
    <div class="game-grid" id="gameGrid"></div>
  </div>

  <div class="footer">
    <div class="score-area">分數：<span id="scoreDisplay">0</span></div>
    <div class="hearts" id="heartsDisplay"></div>
    <button class="help-btn" id="helpBtn" onclick="useHelp()" disabled>幫幫我</button>
  </div>

  <div class="dpad" id="dpad">
    <div></div>
    <button class="dpad-btn" onclick="setDir(0,-1)">▲</button>
    <div></div>
    <button class="dpad-btn" onclick="setDir(-1,0)">◀</button>
    <button class="dpad-btn" onclick="setDir(0, 1)">▼</button>
    <button class="dpad-btn" onclick="setDir( 1,0)">▶</button>
  </div>

<script>
// ── Constants ───────────────────────────────────────────────────────────────
const SCHOOL_YEAR = '114';
const SPEEDS      = { slow: 600, medium: 350, fast: 200 };
let   selectedSpeed = 'medium';
const TTS_MS      = 5000;  // TTS repeat interval
const MAX_WRONG   = 8;
const INIT_WRONG  = 4;     // start with 4 HP (MAX_WRONG - INIT_WRONG hearts shown)
const FOOD_COUNT  = 8;     // food items on grid at once

// ── Dynamic grid dims (set in buildGridDOM) ──────────────────────────────────
let GRID_COLS = 14;
let GRID_ROWS = 10;
let CELL_SIZE = 40;

// ── Vocab data ───────────────────────────────────────────────────────────────
let VOCAB         = [];
let keepWords     = [];
let currentBucket = '7.1';
let currentDiff   = 'keep';

// ── Game state ────────────────────────────────────────────────────────────────
let snake   = [];          // [{x,y}], head first
let dir     = {x:1, y:0};
let nextDir = {x:1, y:0};

// food: Map "x,y" → {wordIdx, sylIdx, block, rendered}
let food = new Map();

let targetWordIdx    = -1;
let targetSylBlocks  = [];
let collectedSet     = new Set(); // which sylIdx have been collected
let expectedOrderIdx = 0;        // next sylIdx for in-order bonus tracking
let inOrderSoFar     = true;     // all collected so far were in order
let usedHelp         = false;
let wrongCount       = 0;
let wrongInThisWord  = false;  // any wrong syllable eaten in current word
let score            = 0;
let answeredIndices = new Set();

let gameRunning  = false;
let celebrating  = false;   // true after word complete, until snake hits a corner
let loopTimer    = null;
let ttsTimer     = null;

// cached DOM cells: key → element
let cellEls          = {};
let prevCellState    = {};
let baseCellFontSize = 12;
let borderCells      = new Set();

let gameStartTime  = 0;
let timerInterval  = null;

// ── Syllable rendering (matches flashcard) ───────────────────────────────────
function renderSylBlock(part) {
  const stripped = part.replace(/\[[^\]]*\]/g, '');
  const stressed = /[A-Z]/.test(stripped);

  let inner = '';
  let last  = 0;
  const re  = /\[([A-Za-z]+)\]/g;
  let m;
  while ((m = re.exec(part)) !== null) {
    const before = part.slice(last, m.index);
    if (before) inner += before.toLowerCase();
    inner += `<span class="syl-silent">${m[1].toLowerCase()}</span>`;
    last = m.index + m[0].length;
  }
  inner += part.slice(last).toLowerCase();

  return stressed ? `<span class="syl-stress">${inner}</span>` : inner;
}

function renderSyl(syl) {
  if (!syl) return '';
  const dot = '<span class="syl-dot">·</span>';
  return syl.split('·').map(renderSylBlock).join(dot);
}

function splitSilent(part) {
  const result = [];
  const re = /\[([A-Za-z]+)\]/g;
  let last = 0, m;
  while ((m = re.exec(part)) !== null) {
    if (m.index > last) result.push(part.slice(last, m.index));
    result.push(`[${m[1]}]`);
    last = m.index + m[0].length;
  }
  if (last < part.length) result.push(part.slice(last));
  return result.filter(b => b.length > 0);
}

// Returns the visible letter sequence of a syl block (case/bracket-insensitive).
// 'SO' → 'so', 'so' → 'so', '[K]NEE' → 'knee'  — used for visual dedup.
function sylBlockDisplayText(part) {
  return part.replace(/[\[\]]/g, '').toLowerCase();
}

// Split syl string → individual block tokens (· and spaces, then split out silent-letter markers)
function getSylBlocks(wordObj) {
  if (!wordObj.syl) return [wordObj.word.toUpperCase()];
  const parts = wordObj.syl.split(/[·\s]+/).filter(b => b.length > 0);
  return parts.flatMap(splitSilent);
}

// ── Grid helpers ──────────────────────────────────────────────────────────────
function key(x, y) { return `${x},${y}`; }

function snakeSet() {
  const s = new Set();
  snake.forEach(p => s.add(key(p.x, p.y)));
  return s;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Returns up to `count` inner cells where no two are 4-directionally adjacent.
function getIsolatedFreeCells(count) {
  const excl = snakeSet();
  borderCells.forEach(k => excl.add(k));
  food.forEach((_, k) => {
    excl.add(k);
    const [fx, fy] = k.split(',').map(Number);
    [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dx,dy]) => excl.add(key(fx+dx, fy+dy)));
  });

  const cands = [];
  for (let y = 0; y < GRID_ROWS; y++)
    for (let x = 0; x < GRID_COLS; x++) {
      if (!excl.has(key(x, y))) cands.push({x, y});
    }
  shuffle(cands);

  const result = [];
  for (const {x, y} of cands) {
    if (result.length >= count) break;
    const k = key(x, y);
    if (excl.has(k)) continue;
    result.push({x, y});
    excl.add(k);
    [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dx,dy]) => excl.add(key(x+dx, y+dy)));
  }
  return result;
}

// ── Food management ───────────────────────────────────────────────────────────
function buildFoodSet() {
  food.clear();

  const items = targetSylBlocks.map((block, si) => ({
    wordIdx: targetWordIdx, sylIdx: si, block
  }));

  // Track all display-texts already on the board (targets + chosen distractors).
  // Comparison is visual (strip brackets, lowercase) so 'SO' and 'so' both map to 'so'.
  const usedDisplayTexts = new Set(targetSylBlocks.map(sylBlockDisplayText));

  const others = keepWords
    .map((w, i) => ({w, i}))
    .filter(({i}) => i !== targetWordIdx);
  shuffle(others);

  for (const {w, i} of others) {
    if (items.length >= FOOD_COUNT) break;
    const blocks = getSylBlocks(w);
    const available = blocks.filter(b => !usedDisplayTexts.has(sylBlockDisplayText(b)));
    if (!available.length) continue;
    const block = available[Math.floor(Math.random() * available.length)];
    items.push({wordIdx: i, sylIdx: blocks.indexOf(block), block});
    usedDisplayTexts.add(sylBlockDisplayText(block)); // prevent further duplicates
  }

  shuffle(items);
  const cells = getIsolatedFreeCells(items.length);
  items.forEach(({wordIdx, sylIdx, block}, idx) => {
    if (idx >= cells.length) return;
    const {x, y} = cells[idx];
    food.set(key(x, y), {wordIdx, sylIdx, block, rendered: renderSylBlock(block)});
  });
}

function useHelp() {
  if (!gameRunning || usedHelp) return;
  usedHelp = true;
  const btn = document.getElementById('helpBtn');
  btn.disabled = true;
  btn.textContent = '已使用 (×0.5)';

  // Remove all non-target syllables
  for (const [k, item] of food.entries()) {
    if (item.wordIdx !== targetWordIdx) food.delete(k);
  }
  render();
}

// ── Target word ───────────────────────────────────────────────────────────────
function pickNextWord() {
  const available = keepWords.map((_, i) => i).filter(i => !answeredIndices.has(i));
  if (available.length === 0) return; // all done — endGameComplete() handles this

  targetWordIdx    = available[Math.floor(Math.random() * available.length)];
  targetSylBlocks  = getSylBlocks(keepWords[targetWordIdx]);
  collectedSet     = new Set();
  expectedOrderIdx = 0;
  inOrderSoFar     = true;
  usedHelp         = false;
  wrongInThisWord  = false;

  const btn = document.getElementById('helpBtn');
  btn.disabled    = false;
  btn.textContent = '幫幫我';

  document.getElementById('zhMeaning').textContent = keepWords[targetWordIdx].zh;
  updateCollectedSlots();
  buildFoodSet();
  startTtsTimer();
}

function updateCollectedSlots() {
  const el = document.getElementById('collectedSlots');
  el.innerHTML = targetSylBlocks.map((b, i) =>
    collectedSet.has(i)
      ? `<span class="syl-slot filled">${renderSylBlock(b)}</span>`
      : `<span class="syl-slot">＿</span>`
  ).join('');
}

// ── Snake ──────────────────────────────────────────────────────────────────────
function initSnake() {
  const my = GRID_ROWS - 1;            // start on bottom safe border
  const mx = Math.floor(GRID_COLS / 2);
  snake   = [{x:mx, y:my}, {x:mx-1, y:my}, {x:mx-2, y:my}];
  dir     = {x:1, y:0};
  nextDir = {x:1, y:0};
}

function isCorner(x, y) {
  return (x === 0 || x === GRID_COLS - 1) && (y === 0 || y === GRID_ROWS - 1);
}
function isCornerKey(k) {
  return k === key(0, 0) || k === key(GRID_COLS - 1, 0) ||
         k === key(0, GRID_ROWS - 1) || k === key(GRID_COLS - 1, GRID_ROWS - 1);
}

function startNextWord() {
  celebrating = false;
  if (answeredIndices.size >= keepWords.length) {
    endGameComplete();
    return;
  }
  pickNextWord();
  render();
}

function moveSnake() {
  dir = {...nextDir};
  const head = snake[0];
  const nx   = (head.x + dir.x + GRID_COLS) % GRID_COLS;
  const ny   = (head.y + dir.y + GRID_ROWS) % GRID_ROWS;
  const k    = key(nx, ny);
  const newHead = {x: nx, y: ny};

  if (celebrating) {
    snake.unshift(newHead);
    snake.pop();
    if (isCorner(nx, ny)) startNextWord();
    return;
  }

  if (food.has(k)) {
    const item = food.get(k);
    food.delete(k);

    if (item.wordIdx === targetWordIdx) {
      // Correct: grow (cap at 8)
      snake.unshift(newHead);
      if (snake.length > 8) snake.pop();

      if (item.sylIdx === expectedOrderIdx) {
        expectedOrderIdx++;
      } else {
        inOrderSoFar = false;
      }
      collectedSet.add(item.sylIdx);
      updateCollectedSlots();

      if (collectedSet.size === targetSylBlocks.length) {
        onWordComplete();
        return;
      }
    } else {
      // Wrong: advance normally then shrink by 1 (min 2 segments)
      snake.unshift(newHead);
      snake.pop();                          // normal advance
      if (snake.length > 2) snake.pop();   // shrink
      showWrongFeedback(nx, ny);
      onWrongSyllable();
    }
  } else {
    snake.unshift(newHead);
    snake.pop();
  }
}

// ── Game events ────────────────────────────────────────────────────────────────
function onWordComplete() {
  celebrating = true;
  answeredIndices.add(targetWordIdx);
  score += usedHelp ? 0.5 : 1;
  updateScore();
  updateProgress();

  // Heal: normal-level word (diff !== 'easy'), ≥2 syllables, in-order, zero mistakes this word
  const word = keepWords[targetWordIdx];
  const canHeal = word.diff !== 'easy' &&
                  targetSylBlocks.length >= 2 &&
                  inOrderSoFar &&
                  !wrongInThisWord;
  if (canHeal) {
    wrongCount = Math.max(0, wrongCount - 1);
    updateHearts();
  }

  food.clear();   // all distractors vanish immediately
  stopTtsTimer();

  document.getElementById('helpBtn').disabled = true;
  const isLast = answeredIndices.size >= keepWords.length;
  document.getElementById('zhMeaning').innerHTML = isLast
    ? '<span style="color:#16a34a;font-size:20px">✓ 最後一關！引導蛇到任一角落 ➜ 完成</span>'
    : '<span style="color:#16a34a;font-size:20px">✓ 通關！引導蛇到任一角落 ➜ 下一關</span>';
}

function showWrongFeedback(x, y) {
  // Shake the grid wrapper
  const wrapper = document.querySelector('.grid-wrapper');
  wrapper.classList.remove('wrong-shake');
  void wrapper.offsetWidth; // force reflow so re-adding triggers animation
  wrapper.classList.add('wrong-shake');
  wrapper.addEventListener('animationend', () => wrapper.classList.remove('wrong-shake'), {once: true});

  // Floating "-1 💔" rising from the eaten cell
  const cell = cellEls[key(x, y)];
  if (!cell) return;
  const r = cell.getBoundingClientRect();
  const popup = document.createElement('div');
  popup.className = 'wrong-popup';
  popup.textContent = '-1 💔';
  popup.style.left = (r.left + r.width / 2 - 28) + 'px';
  popup.style.top  = (r.top - 4) + 'px';
  document.body.appendChild(popup);
  popup.addEventListener('animationend', () => popup.remove(), {once: true});
}

function onWrongSyllable() {
  wrongInThisWord = true;
  wrongCount++;
  updateHearts();
  if (wrongCount >= MAX_WRONG) endGame();
}

function updateScore() {
  document.getElementById('scoreDisplay').textContent =
    Number.isInteger(score) ? score : score.toFixed(1);
}

function updateHearts() {
  const rem = MAX_WRONG - wrongCount;
  document.getElementById('heartsDisplay').textContent =
    '❤️'.repeat(Math.max(rem, 0)) + '🖤'.repeat(Math.min(wrongCount, MAX_WRONG));
}

// ── Custom word overrides (mirrors flashcard localStorage) ────────────────────
function applyWordCustoms(words) {
  try {
    const c = JSON.parse(localStorage.getItem(`jrabc_custom_${currentBucket}`) || '{}');
    return words
      .map(w => c[w.word] ? {...w, diff: c[w.word]} : w)
      .filter(w => w.diff !== 'hidden');
  } catch { return words; }
}

// ── Cookie helpers ────────────────────────────────────────────────────────────
function getCookie(name) {
  const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}
function setCookie(name, val) {
  document.cookie = `${name}=${encodeURIComponent(val)}; max-age=${365*86400}; path=/`;
}

// ── Snake records (per-bucket, per-diff) ──────────────────────────────────────
function snakeRecKey(diff, type) {
  return `jrabc_snake_${type}_${currentBucket}_${diff}`;
}
function getSnakeRecord(diff) {
  const s = getCookie(snakeRecKey(diff, 'score'));
  const t = getCookie(snakeRecKey(diff, 'time'));
  return { score: s !== null ? parseFloat(s) : null,
           time:  t !== null ? parseInt(t)   : null };
}
function saveSnakeRecord(diff, newScore, newTimeMs) {
  const rec = getSnakeRecord(diff);
  const better = rec.score === null || newScore > rec.score;
  const sameScore = !better && newScore === rec.score;
  if (better) {
    setCookie(snakeRecKey(diff, 'score'), newScore.toFixed(1));
    if (newTimeMs !== null) setCookie(snakeRecKey(diff, 'time'), newTimeMs);
  } else if (sameScore && newTimeMs !== null && (rec.time === null || newTimeMs < rec.time)) {
    setCookie(snakeRecKey(diff, 'time'), newTimeMs);
  }
  renderSnakeRecords();
}
function clearSnakeRecords() {
  if (!confirm('確定要清除本冊蛇遊戲記錄嗎？')) return;
  ['keep','easy','all'].forEach(d => {
    document.cookie = `${snakeRecKey(d, 'score')}=; max-age=0; path=/`;
    document.cookie = `${snakeRecKey(d, 'time')}=; max-age=0; path=/`;
  });
  renderSnakeRecords();
}
function renderSnakeRecords() {
  ['keep','easy','all'].forEach(d => {
    const el = document.getElementById(`snake-rec-${d}`);
    if (!el) return;
    const rec = getSnakeRecord(d);
    const s = rec.score !== null ? `最高分 ${rec.score.toFixed(1)}` : '';
    const t = rec.time  !== null ? `最快 ${formatTime(rec.time)}`   : '';
    el.textContent = (s && t) ? `${s} · ${t}` : (s || t || '尚無記錄');
  });
}

// ── Timer & progress ──────────────────────────────────────────────────────────
function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  return `${m}:${String(s % 60).padStart(2, '0')}`;
}

function updateProgress() {
  const el = document.getElementById('progressDisplay');
  if (el) el.textContent = `${answeredIndices.size} / ${keepWords.length} 個單字`;
}

function startTimerDisplay() {
  stopTimerDisplay();
  const el = document.getElementById('timerDisplay');
  timerInterval = setInterval(() => {
    if (el) el.textContent = `⏱ ${formatTime(Date.now() - gameStartTime)}`;
  }, 1000);
}

function stopTimerDisplay() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function endGameComplete() {
  gameRunning = false;
  clearTimeout(loopTimer); loopTimer = null;
  stopTtsTimer();
  stopTimerDisplay();
  document.getElementById('quitBtn').hidden = true;

  const totalMs = Date.now() - gameStartTime;
  saveSnakeRecord(currentDiff, score, totalMs);
  const elapsed = formatTime(totalMs);
  document.getElementById('goTitle').textContent = '🎉 全部通關！';
  document.getElementById('goSub').innerHTML =
    `全部 <strong>${keepWords.length}</strong> 個單字完成！<br>` +
    `得分：<strong style="color:#92400e;font-size:22px">${
      Number.isInteger(score) ? score : score.toFixed(1)
    }</strong><br>` +
    `用時：<strong>${elapsed}</strong>`;
  document.getElementById('gameOverScreen').hidden = false;
}

function quitGame() {
  gameRunning = false;
  clearTimeout(loopTimer); loopTimer = null;
  stopTtsTimer();
  stopTimerDisplay();
  document.getElementById('quitBtn').hidden = true;

  saveSnakeRecord(currentDiff, score, null); // no time for incomplete runs
  const elapsed = formatTime(Date.now() - gameStartTime);
  document.getElementById('goTitle').textContent = '中途放棄';
  document.getElementById('goSub').innerHTML =
    `得分：<strong style="color:#92400e;font-size:22px">${
      Number.isInteger(score) ? score : score.toFixed(1)
    }</strong><br>` +
    `進度：<strong>${answeredIndices.size} / ${keepWords.length}</strong> 個單字<br>` +
    `用時：<strong>${elapsed}</strong>`;
  document.getElementById('gameOverScreen').hidden = false;
}

// ── TTS ────────────────────────────────────────────────────────────────────────
function speakWord() {
  if (!keepWords[targetWordIdx]) return;
  const u = new SpeechSynthesisUtterance(keepWords[targetWordIdx].word);
  u.lang = 'en-US';
  u.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function startTtsTimer() {
  stopTtsTimer();
  speakWord();
  ttsTimer = setInterval(speakWord, TTS_MS);
}

function stopTtsTimer() {
  if (ttsTimer) { clearInterval(ttsTimer); ttsTimer = null; }
  speechSynthesis.cancel();
}

// ── Dynamic tick speed ────────────────────────────────────────────────────────
// Longer snake = faster. SPEEDS[selectedSpeed] is the midpoint (length 5).
function computeTickMs() {
  const len  = Math.max(2, Math.min(8, snake.length));
  const frac = (len - 2) / 6;              // 0 at len 2 → 1 at len 8
  const base = SPEEDS[selectedSpeed];
  return Math.round(base * (1.8 - 1.3 * frac)); // len2: base×1.8, len8: base×0.5
}

function scheduleTick() {
  loopTimer = setTimeout(() => {
    if (!gameRunning) return;
    tick();
    scheduleTick();
  }, computeTickMs());
}

// ── Game flow ──────────────────────────────────────────────────────────────────
function selectSpeed(s) {
  selectedSpeed = s;
  document.querySelectorAll('.speed-btn').forEach(b =>
    b.classList.toggle('speed-selected', b.dataset.speed === s)
  );
}

function startGame(diff) {
  currentDiff = diff || 'keep';
  const base = applyWordCustoms(VOCAB);
  if (currentDiff === 'easy') {
    keepWords = base.filter(w => w.diff === 'easy');
  } else if (currentDiff === 'all') {
    keepWords = base.filter(w => w.diff === 'keep' || w.diff === 'easy');
  } else {
    keepWords = base.filter(w => w.diff === 'keep');
  }
  document.getElementById('startScreen').hidden = true;
  wrongCount = INIT_WRONG; score = 0; answeredIndices.clear();
  celebrating = false;
  updateScore(); updateHearts();
  buildGridDOM();
  initSnake();
  pickNextWord();
  updateProgress();
  render();
  gameStartTime = Date.now();
  startTimerDisplay();
  document.getElementById('quitBtn').hidden = false;
  gameRunning = true;
  scheduleTick();
}

function restartGame() {
  // Re-apply the same difficulty filter chosen at start
  const base = applyWordCustoms(VOCAB);
  if (currentDiff === 'easy') {
    keepWords = base.filter(w => w.diff === 'easy');
  } else if (currentDiff === 'all') {
    keepWords = base.filter(w => w.diff === 'keep' || w.diff === 'easy');
  } else {
    keepWords = base.filter(w => w.diff === 'keep');
  }
  document.getElementById('gameOverScreen').hidden = true;
  wrongCount = INIT_WRONG; score = 0; answeredIndices.clear();
  celebrating = false;
  updateScore(); updateHearts();
  buildGridDOM();
  initSnake();
  food.clear();
  pickNextWord();
  updateProgress();
  render();
  gameStartTime = Date.now();
  startTimerDisplay();
  document.getElementById('quitBtn').hidden = false;
  gameRunning = true;
  scheduleTick();
}

function endGame() {
  gameRunning = false;
  clearTimeout(loopTimer); loopTimer = null;
  stopTtsTimer();
  stopTimerDisplay();
  document.getElementById('quitBtn').hidden = true;

  saveSnakeRecord(currentDiff, score, null); // no time for hearts-depleted end
  const elapsed = formatTime(Date.now() - gameStartTime);
  document.getElementById('goTitle').textContent = '遊戲結束！';
  document.getElementById('goSub').innerHTML =
    `得分：<strong style="color:#92400e;font-size:22px">${
      Number.isInteger(score) ? score : score.toFixed(1)
    }</strong> 題<br>` +
    `進度：<strong>${answeredIndices.size} / ${keepWords.length}</strong> 個單字<br>` +
    `用時：<strong>${elapsed}</strong>`;
  document.getElementById('gameOverScreen').hidden = false;
}

function foodFontSize(block) {
  const len = block.replace(/[\[\]]/g, '').length;
  if (len <= 3) return baseCellFontSize;
  if (len <= 4) return Math.max(8, baseCellFontSize - 2);
  return Math.max(7, baseCellFontSize - 3);
}

// ── Render ─────────────────────────────────────────────────────────────────────
function buildGridDOM() {
  const grid  = document.getElementById('gameGrid');
  // gap=1px, padding=2px, border=2px → total overhead per row = 1*(GRID_COLS-1)+2*2+2*2=GRID_COLS+11
  const GAP = 1, GPAD = 2, GBORDER = 2;
  const overhead = GAP * (GRID_COLS - 1) + 2 * (GPAD + GBORDER);
  const wrapperInner = Math.min(window.innerWidth - 32, 760 - 32); // 16px padding each side
  CELL_SIZE   = Math.max(22, Math.min(46, Math.floor((wrapperInner - overhead) / GRID_COLS)));
  baseCellFontSize = Math.max(9, Math.floor(CELL_SIZE * 0.42));

  const gridW = CELL_SIZE * GRID_COLS + overhead;
  grid.style.gridTemplateColumns = `repeat(${GRID_COLS}, ${CELL_SIZE}px)`;
  grid.style.width = `${gridW}px`;

  grid.innerHTML = '';
  cellEls = {}; prevCellState = {};
  borderCells.clear();

  for (let y = 0; y < GRID_ROWS; y++) {
    for (let x = 0; x < GRID_COLS; x++) {
      const k    = key(x, y);
      const onBorder = x === 0 || x === GRID_COLS - 1 || y === 0 || y === GRID_ROWS - 1;
      const cell = document.createElement('div');
      cell.className = onBorder ? 'cell safe-border' : 'cell';
      cell.style.width  = `${CELL_SIZE}px`;
      cell.style.height = `${CELL_SIZE}px`;
      cell.style.fontSize = `${baseCellFontSize}px`;
      grid.appendChild(cell);
      cellEls[k] = cell;
      if (onBorder) borderCells.add(k);
    }
  }
}

function render() {
  const ss      = snakeSet();
  const headKey = snake.length ? key(snake[0].x, snake[0].y) : null;
  const tailKey = snake.length > 1 ? key(snake[snake.length-1].x, snake[snake.length-1].y) : null;

  for (const k in cellEls) {
    let state;
    if (k === headKey)         state = 'head';
    else if (k === tailKey)    state = 'tail';
    else if (ss.has(k))        state = 'body';
    else if (food.has(k))      state = 'food:' + food.get(k).block;
    else if (borderCells.has(k)) state = (celebrating && isCornerKey(k)) ? 'corner' : 'safe';
    else state = '';

    if (prevCellState[k] === state) continue;
    prevCellState[k] = state;

    const cell = cellEls[k];
    if (state === 'head') {
      cell.className = 'cell snake-head';
      cell.innerHTML = '';
      cell.dataset.dir = dir.x === 1 ? 'r' : dir.x === -1 ? 'l' : dir.y === 1 ? 'd' : 'u';
      cell.style.fontSize = baseCellFontSize + 'px';
    } else if (state === 'body') {
      cell.className = 'cell snake-body';
      cell.innerHTML = '';
      cell.style.fontSize = baseCellFontSize + 'px';
    } else if (state === 'tail') {
      cell.className = 'cell snake-tail';
      cell.innerHTML = '';
      cell.style.fontSize = baseCellFontSize + 'px';
    } else if (state.startsWith('food:')) {
      cell.className = 'cell food';
      cell.innerHTML = food.get(k).rendered;
      cell.style.fontSize = foodFontSize(food.get(k).block) + 'px';
    } else if (state === 'corner') {
      cell.className = 'cell corner-hint';
      cell.innerHTML = '';
      cell.style.fontSize = baseCellFontSize + 'px';
    } else if (state === 'safe') {
      cell.className = 'cell safe-border';
      cell.innerHTML = '';
      cell.style.fontSize = baseCellFontSize + 'px';
    } else {
      cell.className = 'cell';
      cell.innerHTML = '';
      cell.style.fontSize = baseCellFontSize + 'px';
    }
  }
}

function tick() {
  if (!gameRunning) return;
  moveSnake();
  render();
}

// ── Input ──────────────────────────────────────────────────────────────────────
function setDir(dx, dy) {
  if (!gameRunning) return;
  // Prevent 180° reversal
  if (dx !== -dir.x || dy !== -dir.y) nextDir = {x:dx, y:dy};
}

const KEY_MAP = {
  ArrowUp:    [0,-1], ArrowDown: [0,1],
  ArrowLeft: [-1, 0], ArrowRight:[1,0],
  w:[0,-1], s:[0,1], a:[-1,0], d:[1,0],
};

document.addEventListener('keydown', e => {
  const d = KEY_MAP[e.key];
  if (!d) return;
  e.preventDefault();
  setDir(d[0], d[1]);
});

// Touch swipe
let touchOrigin = null;
document.addEventListener('touchstart', e => {
  touchOrigin = {x: e.touches[0].clientX, y: e.touches[0].clientY};
}, {passive: true});
document.addEventListener('touchend', e => {
  if (!touchOrigin) return;
  const dx = e.changedTouches[0].clientX - touchOrigin.x;
  const dy = e.changedTouches[0].clientY - touchOrigin.y;
  touchOrigin = null;
  if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
  else setDir(0, dy > 0 ? 1 : -1);
}, {passive: true});

// ── Init ───────────────────────────────────────────────────────────────────────
(async () => {
  const params = new URLSearchParams(location.search);
  currentBucket = params.get('bucket') || '7.1';

  const LABELS = {
    '7.1':'國一上','7.2':'國一下','8.1':'國二上','8.2':'國二下',
  };
  const label = LABELS[currentBucket] || currentBucket;
  document.getElementById('bucketTag').textContent   = label;
  document.getElementById('startInfo').textContent   = `資料集：${label}`;

  try {
    const res  = await fetch(`../flashcard/data/${SCHOOL_YEAR}.${currentBucket}.json`);
    const data = await res.json();
    VOCAB      = data.words;
    // keepWords is set by startGame() based on chosen difficulty
    buildGridDOM();
    renderSnakeRecords();
  } catch {
    document.getElementById('startScreen').innerHTML =
      '<div class="overlay-card" style="color:#fc8181">資料載入失敗，請重新整理</div>';
  }
})();
</script>
