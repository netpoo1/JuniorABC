<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JuniorABC 單字卡</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: #eef2f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
    }

    /* ── Header ── */
    .header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .app-title { font-size: 17px; font-weight: 700; color: #2d3748; }
    .bucket-badge {
      background: #ebf8ff; color: #2b6cb0;
      border-radius: 20px; padding: 4px 12px;
      font-size: 12px; font-weight: 600;
    }

    /* ── Progress ── */
    .progress-row {
      width: 100%; max-width: 480px;
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 18px;
    }
    .progress-bar {
      flex: 1; height: 5px;
      background: #d0dae6; border-radius: 3px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: #4299e1; border-radius: 3px;
      transition: width 0.35s ease;
    }
    .counter { font-size: 13px; color: #718096; white-space: nowrap; }

    /* ── Flip Card ── */
    .scene {
      width: 100%; max-width: 480px; height: 300px;
      perspective: 700px; cursor: pointer;
      margin-bottom: 22px;
      -webkit-tap-highlight-color: transparent;
    }
    .card {
      width: 100%; height: 100%; position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(.4,0,.2,1);
    }
    .card.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute; inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 20px;
      background: white;
      box-shadow: 0 6px 28px rgba(0,0,0,.09);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 28px; gap: 6px;
      user-select: none;
    }
    .card-back {
      transform: rotateY(180deg);
      background: #f7fafc;
    }

    .word {
      font-size: 44px; font-weight: 800;
      color: #1a202c; text-align: center; line-height: 1.15;
    }
    .syllables {
      font-size: 13px; color: #b0bec5; letter-spacing: 1px;
      min-height: 18px;
    }
    .syl-stress { color: #4299e1; font-weight: 700; }
    .syl-silent { color: #fc8181; text-decoration: line-through; text-decoration-color: #fc8181; }
    .syl-dot    { color: #d9e2ec; }
    .pos {
      font-size: 13px; color: #a0aec0; font-style: italic;
      margin-bottom: 12px;
    }
    .meaning {
      font-size: 34px; font-weight: 700;
      color: #2d3748; text-align: center; line-height: 1.3;
    }
    .flip-hint {
      font-size: 12px; color: #cbd5e0; margin-top: 14px;
    }

    /* ── Audio button ── */
    .audio-btn {
      display: flex; align-items: center; gap: 6px;
      background: none;
      border: 2px solid #bee3f8; border-radius: 50px;
      padding: 7px 18px;
      font-size: 15px; color: #2b6cb0;
      cursor: pointer; transition: background .15s;
    }
    .audio-btn:hover  { background: #ebf8ff; }
    .audio-btn:active { background: #bee3f8; }
    .audio-btn.playing { border-color: #4299e1; color: #1a6cb0; }

    /* ── Controls ── */
    .controls {
      width: 100%; max-width: 480px;
      display: flex; gap: 10px; justify-content: center;
      margin-bottom: 18px;
    }
    .btn {
      flex: 1; max-width: 150px;
      padding: 13px 8px;
      border: none; border-radius: 14px;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: transform .1s, opacity .15s;
    }
    .btn:active:not(:disabled) { transform: scale(.96); }
    .btn:disabled { opacity: .35; cursor: default; }
    .btn-prev    { background: #e2e8f0; color: #4a5568; }
    .btn-shuffle { background: #fefcbf; color: #744210; }
    .btn-next    { background: #4299e1; color: white;   }

    /* ── Shuffle indicator ── */
    .shuffle-on { background: #f6e05e !important; }

    /* ── Auto-play button ── */
    .auto-row {
      width: 100%; max-width: 480px;
      margin-top: -6px; margin-bottom: 18px;
    }
    .btn-auto {
      width: 100%; padding: 13px;
      border: none; border-radius: 14px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      background: #c6f6d5; color: #276749;
      transition: background .2s, color .2s, transform .1s;
    }
    .btn-auto:active { transform: scale(.98); }
    .btn-auto.auto-on { background: #fed7d7; color: #9b2c2c; }

    /* ── Auto-play settings ── */
    .settings-row {
      width: 100%; max-width: 480px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; margin-bottom: 10px;
      background: white; border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .setting-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; color: #4a5568; cursor: pointer; user-select: none;
    }
    .setting-label input[type="checkbox"] {
      width: 16px; height: 16px; cursor: pointer; accent-color: #4299e1;
    }
    .speed-group { display: flex; gap: 4px; }
    .speed-btn {
      padding: 6px 14px; border: 2px solid #e2e8f0; border-radius: 20px;
      background: white; font-size: 13px; font-weight: 600;
      color: #718096; cursor: pointer; transition: all .15s;
    }
    .speed-btn.active { background: #4299e1; color: white; border-color: #4299e1; }

    /* ── Mode toggle ── */
    .mode-row {
      width: 100%; max-width: 480px;
      display: flex; justify-content: center; gap: 0;
      margin-bottom: 16px;
    }
    .mode-btn {
      flex: 1; max-width: 160px;
      padding: 8px 0; border: 2px solid #bee3f8;
      background: white; color: #718096;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background .15s, color .15s;
    }
    .mode-btn:first-child { border-radius: 20px 0 0 20px; border-right-width: 1px; }
    .mode-btn:last-child  { border-radius: 0 20px 20px 0; border-left-width: 1px;  }
    .mode-btn:not(:first-child):not(:last-child) { border-left-width: 1px; border-right-width: 1px; }
    .mode-btn.active { background: #4299e1; color: white; border-color: #4299e1; }

    /* ── Keyboard hint ── */
    .kbd-hint {
      font-size: 11px; color: #b0bec5; text-align: center; line-height: 1.8;
    }

    /* ── Footer ── */
    .site-footer {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      width: 100%; max-width: 480px;
      text-align: center;
      font-size: 11px; color: #a0aec0; line-height: 1.9;
    }
    .site-footer a {
      color: #a0aec0; text-decoration: none;
    }
    .site-footer a:hover { color: #4299e1; }
  </style>
</head>
<body>

<div class="header">
  <span class="app-title">JuniorABC 單字卡</span>
  <span class="bucket-badge" id="bucketBadge">7.1 國一上</span>
</div>

<div class="mode-row">
  <button class="mode-btn active" id="modeEnZh" onclick="setMode('en2zh')">EN → 中文</button>
  <button class="mode-btn"        id="modeZhEn" onclick="setMode('zh2en')">中文 → EN</button>
</div>

<div class="mode-row" style="margin-bottom:14px;">
  <button class="mode-btn active" id="dm-keep" onclick="setDeckMode('keep')">一般模式</button>
  <button class="mode-btn"        id="dm-easy" onclick="setDeckMode('easy')">簡單模式</button>
  <button class="mode-btn"        id="dm-all"  onclick="setDeckMode('all')">混合模式</button>
</div>

<div class="progress-row">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <span class="counter" id="counterText">…</span>
</div>

<div class="scene" id="scene" onclick="flipCard()">
  <div class="card" id="card">

    <div class="card-face card-front">
      <div class="word"      id="frontMainText"></div>
      <div class="syllables" id="syllablesText"></div>
      <div class="pos"       id="frontSubText"></div>
      <button class="audio-btn" id="audioBtn"
              onclick="event.stopPropagation(); playAudio()">
        🔊 發音
      </button>
      <div class="flip-hint" id="frontHint"></div>
    </div>

    <div class="card-face card-back">
      <div class="meaning" id="backMainText"></div>
      <div class="pos"     id="backSubText" style="margin-top:-4px;"></div>
      <button class="audio-btn"
              onclick="event.stopPropagation(); playAudio()">
        🔊 再聽一次
      </button>
      <div class="flip-hint">點擊卡片返回</div>
    </div>

  </div>
</div>

<div class="controls">
  <button class="btn btn-prev"    id="prevBtn"    onclick="navigate(-1)">← 上一張</button>
  <button class="btn btn-shuffle" id="shuffleBtn" onclick="toggleShuffle()">🔀 亂序</button>
  <button class="btn btn-next"    id="nextBtn"    onclick="navigate(1)">下一張 →</button>
</div>

<div class="settings-row">
  <label class="setting-label">
    <input type="checkbox" id="zhTTSToggle"> 中文語音
  </label>
  <div class="speed-group">
    <button class="speed-btn"        id="spd-fast"   onclick="setSpeed('fast')">快</button>
    <button class="speed-btn active" id="spd-medium" onclick="setSpeed('medium')">中</button>
    <button class="speed-btn"        id="spd-slow"   onclick="setSpeed('slow')">慢</button>
  </div>
</div>

<div class="auto-row">
  <button class="btn-auto" id="autoBtn" onclick="toggleAutoPlay()">▶ 自動播放</button>
</div>

<div class="kbd-hint">
  ← → 換張 &nbsp;|&nbsp; 空白鍵 翻牌 &nbsp;|&nbsp; P 發音 &nbsp;|&nbsp; ESC 停止自動<br>
  音節標記：<span style="color:#4299e1;font-weight:700;">藍色粗體</span>=重音 &nbsp;|&nbsp; <span style="color:#fc8181;text-decoration:line-through;">紅色刪除線</span>=不發音字母
</div>

<footer class="site-footer">
  <div>荷芯數位工作室</div>
  <div>© 2026 &nbsp;<a href="mailto:service@lotus-core.com.tw">service@lotus-core.com.tw</a></div>
</footer>

<script>
// VOCAB is loaded asynchronously — see initApp() at the bottom
let VOCAB = [];

const BUCKET_LABEL = {
  "7.0":"國一全","7.1":"國一上","7.2":"國一下",
  "8.0":"國二全","8.1":"國二上","8.2":"國二下",
  "9.0":"國三全","9.1":"國三上","9.2":"國三下"
};

let deckMode   = 'keep'; // 'keep' | 'easy' | 'all'
let isShuffled = false;
let mode       = 'en2zh'; // 'en2zh' | 'zh2en'

function buildDeck() {
  const base = deckMode === 'all'  ? VOCAB :
               deckMode === 'easy' ? VOCAB.filter(v => v.diff === "easy") :
                                     VOCAB.filter(v => v.diff === "keep");
  return isShuffled ? [...base].sort(() => Math.random() - 0.5) : [...base];
}

let deck = [];
let idx  = 0;

// ── Syllable renderer ────────────────────────────────────
// Convention: uppercase letters in syl string mark the stressed syllable.
// e.g. "e·RAS·er" → "e" gray, "ras" blue+bold, "er" gray
// Encoding: uppercase = stressed syllable, [xx] = silent letter(s)
// e.g. "DAU[GH]·ter" → stressed "dau" + strikethrough "gh" + unstressed "ter"
function renderSyl(syl) {
  if (!syl) return "";
  const dot = '<span class="syl-dot">·</span>';

  return syl.split("·").map(part => {
    // Tokenize: split into normal text and [silent] spans
    const tokens = [];
    let last = 0;
    for (const m of part.matchAll(/\[([^\]]+)\]/g)) {
      if (m.index > last) tokens.push({ silent: false, text: part.slice(last, m.index) });
      tokens.push({ silent: true, text: m[1] });
      last = m.index + m[0].length;
    }
    if (last < part.length) tokens.push({ silent: false, text: part.slice(last) });

    // Stressed if any non-silent token contains uppercase
    const stressed = tokens.some(tk => !tk.silent && /[A-Z]/.test(tk.text));

    const inner = tokens.map(tk =>
      tk.silent
        ? `<span class="syl-silent">${tk.text.toLowerCase()}</span>`
        : tk.text.toLowerCase()
    ).join("");

    return stressed ? `<span class="syl-stress">${inner}</span>` : inner;
  }).join(dot);
}

// ── Deck mode (一般 / 簡單 / 混合) ──────────────────────
function setDeckMode(m) {
  deckMode = m;
  ["keep","easy","all"].forEach(k => {
    document.getElementById("dm-" + k).classList.toggle("active", k === m);
  });
  deck = buildDeck();
  idx  = 0;
  render();
}

// ── Mode toggle ──────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.getElementById("modeEnZh").classList.toggle("active", m === 'en2zh');
  document.getElementById("modeZhEn").classList.toggle("active", m === 'zh2en');
  idx = 0;
  render();
}

// ── Render ──────────────────────────────────────────────
// renderContent: update DOM text/progress only, never touch flipped state
function renderContent() {
  const item = deck[idx];

  if (mode === 'en2zh') {
    document.getElementById("frontMainText").textContent = item.word;
    document.getElementById("syllablesText").innerHTML = renderSyl(item.syl);
    document.getElementById("frontSubText").textContent  = item.pos;
    document.getElementById("frontHint").textContent     = "點擊卡片查看中文";
    document.getElementById("backMainText").textContent  = item.zh;
    document.getElementById("backSubText").textContent   = "";
  } else {
    document.getElementById("frontMainText").textContent = item.zh;
    document.getElementById("syllablesText").innerHTML   = "";
    document.getElementById("frontSubText").textContent  = "";
    document.getElementById("frontHint").textContent     = "點擊卡片查看英文";
    document.getElementById("backMainText").textContent  = item.word;
    document.getElementById("backSubText").textContent   = item.pos;
  }

  document.getElementById("bucketBadge").textContent =
    `${item.bucket} ${BUCKET_LABEL[item.bucket] ?? ""}`;
  document.getElementById("counterText").textContent = `${idx + 1} / ${deck.length}`;
  document.getElementById("progressFill").style.width =
    ((idx + 1) / deck.length * 100) + "%";
  document.getElementById("prevBtn").disabled = idx === 0;
  document.getElementById("nextBtn").disabled = idx === deck.length - 1;
}

// render: full reset including flip state (used on init and shuffle)
function render() {
  renderContent();
  document.getElementById("card").classList.remove("flipped");
}

// ── Flip ────────────────────────────────────────────────
function flipCard() {
  if (autoPlaying) return;
  document.getElementById("card").classList.toggle("flipped");
}

// ── Navigate ────────────────────────────────────────────
let navigating = false;

function navigate(dir) {
  if (navigating) return;
  const next = idx + dir;
  if (next < 0 || next >= deck.length) return;

  const card = document.getElementById("card");

  if (card.classList.contains("flipped")) {
    // Card is showing Chinese (back face).
    // Flip back to front first; update content at the 90° midpoint when
    // both faces are hidden by backface-visibility, so the new Chinese is
    // never visible during the transition.
    navigating = true;
    card.classList.remove("flipped");
    setTimeout(() => {
      idx = next;
      renderContent();
      navigating = false;
    }, 250); // 250ms = half of the 500ms CSS transition
  } else {
    idx = next;
    renderContent();
  }
}

// ── Shuffle ─────────────────────────────────────────────
function toggleShuffle() {
  isShuffled = !isShuffled;
  const btn = document.getElementById("shuffleBtn");
  btn.classList.toggle("shuffle-on", isShuffled);
  btn.textContent = isShuffled ? "🔀 亂序 ON" : "🔀 亂序";
  deck = buildDeck();
  idx  = 0;
  render();
}

// ── Audio ────────────────────────────────────────────────
// Use first token before "/" for compound entries like "pencil case/box"
function lookupWord(raw) {
  return raw.split("/")[0].trim();
}

async function playAudio() {
  const btn = document.getElementById("audioBtn");
  btn.classList.add("playing");
  const word = lookupWord(deck[idx].word);

  let played = false;
  try {
    const res = await fetch(
      `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`,
      { signal: AbortSignal.timeout(4000) }
    );
    if (res.ok) {
      const data = await res.json();
      const phonetics = data[0]?.phonetics ?? [];
      // prefer US audio (contains "-us" or no region tag), then any audio
      const usEntry = phonetics.find(p => p.audio && p.audio.includes("-us"));
      const anyEntry = phonetics.find(p => p.audio && p.audio.trim() !== "");
      const audioUrl = (usEntry ?? anyEntry)?.audio;
      if (audioUrl) {
        await new Audio(audioUrl).play();
        played = true;
      }
    }
  } catch (_) {}

  if (!played && "speechSynthesis" in window) {
    speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(deck[idx].word);
    utt.lang = "en-US";
    utt.rate = 0.85;
    speechSynthesis.speak(utt);
  }

  setTimeout(() => btn.classList.remove("playing"), 800);
}

// ── Auto-play ────────────────────────────────────────────
let autoPlaying  = false;
let autoTimer    = null;
let currentAudio = null;

// Pause duration (ms) after each audio clip finishes
const SPEED_PAUSE = { fast: 1200, medium: 2500, slow: 4500 };
let speed = 'medium';

let zhTTSEnabled = false;

function setSpeed(s) {
  speed = s;
  ["fast","medium","slow"].forEach(k => {
    document.getElementById("spd-" + k).classList.toggle("active", k === s);
  });
}

function wait(ms) {
  return new Promise(resolve => {
    autoTimer = setTimeout(() => { autoTimer = null; resolve(); }, ms);
  });
}

// Awaitable English audio — resolves when clip ends (or on error/fallback)
async function playAudioForAuto() {
  const word = lookupWord(deck[idx].word);
  try {
    const res = await fetch(
      `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`,
      { signal: AbortSignal.timeout(4000) }
    );
    if (res.ok) {
      const data = await res.json();
      const phonetics = data[0]?.phonetics ?? [];
      const usEntry  = phonetics.find(p => p.audio && p.audio.includes("-us"));
      const anyEntry = phonetics.find(p => p.audio && p.audio.trim() !== "");
      const audioUrl = (usEntry ?? anyEntry)?.audio;
      if (audioUrl) {
        await new Promise(resolve => {
          currentAudio = new Audio(audioUrl);
          currentAudio.onended = () => { currentAudio = null; resolve(); };
          currentAudio.onerror = () => { currentAudio = null; resolve(); };
          currentAudio.play().catch(() => { currentAudio = null; resolve(); });
        });
        return;
      }
    }
  } catch (_) {}
  // Web Speech fallback
  if ("speechSynthesis" in window) {
    await new Promise(resolve => {
      speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(deck[idx].word);
      utt.lang  = "en-US";
      utt.rate  = 0.85;
      utt.onend   = resolve;
      utt.onerror = resolve;
      speechSynthesis.speak(utt);
    });
  }
}

// Awaitable Chinese TTS — resolves when speech ends
function playChineseTTSAsync(text) {
  return new Promise(resolve => {
    if (!("speechSynthesis" in window)) { resolve(); return; }
    speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang    = "zh-TW";
    utt.rate    = 0.9;
    utt.onend   = resolve;
    utt.onerror = resolve;
    speechSynthesis.speak(utt);
  });
}

function setAutoControls(disabled) {
  ["prevBtn", "nextBtn", "shuffleBtn", "modeEnZh", "modeZhEn", "zhTTSToggle",
   "spd-fast", "spd-medium", "spd-slow", "dm-keep", "dm-easy", "dm-all"]
    .forEach(id => { const el = document.getElementById(id); if (el) el.disabled = disabled; });
}

function updateAutoBtn() {
  const btn = document.getElementById("autoBtn");
  if (autoPlaying) {
    btn.textContent = "⏹ 停止自動播放";
    btn.classList.add("auto-on");
  } else {
    btn.textContent = "▶ 自動播放";
    btn.classList.remove("auto-on");
  }
}

async function runAutoStep() {
  if (!autoPlaying) return;
  const card = document.getElementById("card");
  card.classList.remove("flipped");

  // ── 正面：播英文 → 停頓 ──────────────────────────────
  await playAudioForAuto();
  if (!autoPlaying) return;
  await wait(SPEED_PAUSE[speed]);
  if (!autoPlaying) return;

  // ── 背面：翻牌 → (中文 TTS →) 英文 → 停頓 ────────────
  card.classList.add("flipped");

  if (zhTTSEnabled) {
    await playChineseTTSAsync(deck[idx].zh);
    if (!autoPlaying) return;
  }

  await playAudioForAuto();
  if (!autoPlaying) return;
  await wait(SPEED_PAUSE[speed]);
  if (!autoPlaying) return;

  // ── 前往下一張 ────────────────────────────────────────
  if (idx >= deck.length - 1) { stopAutoPlay(); return; }
  card.classList.remove("flipped");
  setTimeout(() => { if (autoPlaying) { idx++; renderContent(); } }, 250);
  await wait(500);
  if (!autoPlaying) return;

  runAutoStep();
}

function startAutoPlay() {
  zhTTSEnabled = document.getElementById("zhTTSToggle").checked;
  autoPlaying  = true;
  updateAutoBtn();
  setAutoControls(true);
  document.getElementById("card").classList.remove("flipped");
  runAutoStep();
}

function stopAutoPlay() {
  autoPlaying = false;
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  speechSynthesis.cancel();
  updateAutoBtn();
  setAutoControls(false);
}

function toggleAutoPlay() {
  if (autoPlaying) stopAutoPlay();
  else             startAutoPlay();
}

// ── Keyboard shortcuts ───────────────────────────────────
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (autoPlaying) stopAutoPlay(); return; }
  if (autoPlaying) return;
  if (e.target.tagName === "BUTTON") return;
  switch (e.key) {
    case "ArrowRight": case "ArrowDown":  navigate(1);  break;
    case "ArrowLeft":  case "ArrowUp":    navigate(-1); break;
    case " ": case "Enter": e.preventDefault(); flipCard(); break;
    case "p": case "P": playAudio(); break;
  }
});

// ── Init ────────────────────────────────────────────────
(async () => {
  try {
    const params = new URLSearchParams(location.search);
    const bucket = params.get("bucket") || "7.1";
    const res = await fetch(`data/${bucket}.json`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    VOCAB = data.words;
    deck  = buildDeck();
    render();
  } catch (e) {
    document.getElementById("counterText").textContent = "資料載入失敗";
    console.error("initApp:", e);
  }
})();
</script>
</body>
</html>
