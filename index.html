<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JuniorABC</title>
  <style>
    :root {
      --ink: #233044;
      --muted: #6f7c8f;
      --soft: #f4f7fb;
      --line: #dbe5f0;
      --paper: rgba(255,255,255,.92);
      --blue: #2f80d1;
      --blue-dark: #165f9f;
      --green: #2f9e70;
      --amber: #b7791f;
      --red: #d84d4d;
      --shadow: 0 18px 48px rgba(42,60,85,.12);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button, input { font: inherit; }
    button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    button:not(:disabled):active { filter: brightness(.94); }

    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(255,209,102,.42), transparent 28%),
        radial-gradient(circle at 86% 10%, rgba(111,183,214,.34), transparent 30%),
        linear-gradient(135deg, #f9fbf7 0%, #edf4f8 47%, #f8f3e9 100%);
      min-height: 100dvh;
      padding: 30px 20px 48px;
    }

    .home-shell {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      min-height: calc(100dvh - 78px);
      display: flex;
      flex-direction: column;
    }

    .app-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 26px;
    }
    .brand-mark {
      width: 50px; height: 50px;
      border-radius: 16px;
      display: grid; place-items: center;
      background: #1d3557;
      color: white;
      box-shadow: 0 10px 26px rgba(29,53,87,.22);
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -.5px;
    }
    .brand-row { display: flex; align-items: center; gap: 14px; }
    .app-eyebrow {
      font-size: 13px;
      font-weight: 800;
      color: var(--blue-dark);
      letter-spacing: .14em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .app-title  { font-size: clamp(34px, 6vw, 58px); font-weight: 900; line-height: .95; letter-spacing: -.03em; }
    .app-sub    { max-width: 430px; font-size: 17px; color: var(--muted); line-height: 1.7; }

    .home-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 22px;
      align-items: start;
    }

    .grades {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      width: 100%;
    }

    .grade-card {
      position: relative;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }
    .grade-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 7px;
      background: linear-gradient(90deg, var(--gc, var(--blue)), rgba(255,255,255,0));
    }
    .grade-card.locked { opacity: .6; border-left-color: #cbd5e0; }

    .grade-header {
      display: flex; align-items: flex-start;
      justify-content: space-between; margin-bottom: 20px;
    }
    .grade-label { font-size: 34px; font-weight: 900; line-height: 1; letter-spacing: -.04em; }
    .grade-sub   { font-size: 14px; color: var(--muted); margin-top: 8px; font-weight: 700; }
    .grade-desc  { font-size: 13px; color: #8a96a7; margin-top: 6px; letter-spacing: .04em; }
    .grade-done-badge {
      font-size: 13px; font-weight: 800; color: #146c47;
      background: #d9f8e9; padding: 5px 12px; border-radius: 999px;
      margin-top: 7px; display: inline-block;
    }
    .lock-icon { font-size: 32px; line-height: 1; margin-top: 2px; }

    .bucket-card {
      background: rgba(248,251,255,.78);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
    }
    .bucket-card + .bucket-card { margin-top: 14px; }
    .bucket-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .bucket-tag {
      font-size: 14px; font-weight: 900; color: var(--blue-dark);
      background: #e5f2ff; padding: 5px 12px; border-radius: 999px;
      flex-shrink: 0;
    }
    .bucket-note { font-size: 12px; font-weight: 700; color: #92a0af; }

    .progress-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .prog-item {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 12px;
      font-weight: 800;
      color: #7b8797;
      background: white;
      border: 1px solid #e7edf4;
      border-radius: 13px;
      padding: 10px;
    }
    .prog-label { display: flex; align-items: center; gap: 7px; }
    .seen-ratio { color: var(--blue); font-size: 13px; font-weight: 900; white-space: nowrap; }
    .seen-ratio.done { color: var(--green); }
    .prog-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid #e2e8f0; background: white;
      transition: background .3s, border-color .3s;
    }
    .prog-dot.done { background: var(--green); border-color: var(--green); }

    .action-row {
      display: grid;
      grid-template-columns: 1.5fr repeat(3, 1fr);
      gap: 8px;
    }
    .action-btn {
      min-height: 50px;
      padding: 11px 10px;
      border: 1px solid transparent;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .1s, filter .15s, box-shadow .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      white-space: nowrap;
    }
    .action-btn:active { transform: scale(.97); }
    .action-btn small {
      display: block;
      margin-top: 1px;
      font-size: 11px;
      font-weight: 700;
      opacity: .82;
    }
    .btn-flash {
      background: linear-gradient(135deg, #2f80d1, #1d65a8);
      color: white;
      box-shadow: 0 12px 24px rgba(47,128,209,.24);
      justify-content: flex-start;
      padding-left: 14px;
    }
    .btn-flash:hover { filter: brightness(.95); }
    .btn-game  { background: #eaf8f0; color: #146c47; border-color: #cbeedd; }
    .btn-game:hover  { filter: brightness(.95); }
    .btn-snake { background: #eef2ff; color: #334a91; border-color: #dce4ff; }
    .btn-snake:hover { filter: brightness(.95); }
    .btn-balloon { background: #fff4da; color: var(--amber); border-color: #ffe4a8; }
    .btn-balloon:hover { filter: brightness(.95); }

    .locked-msg { font-size: 16px; color: #a0aec0; text-align: center; padding: 10px 0 4px; }

    .reset-link {
      width: 100%;
      margin-top: 14px;
      font-size: 13px;
      font-weight: 800;
      color: #9aa7b8;
      background: rgba(255,255,255,.62);
      border: 1px solid var(--line);
      border-radius: 14px;
      cursor: pointer;
      padding: 12px 14px;
      min-height: 46px;
      transition: color .15s, border-color .15s, background .15s;
    }
    .reset-link:hover { color: var(--red); border-color: #f1a3a3; background: white; }

    .site-footer {
      margin-top: auto; padding-top: 28px;
      width: 100%;
      text-align: center;
      font-size: 13px; color: #8997a8; line-height: 1.9;
    }
    .site-footer a { color: #8997a8; text-decoration: none; }
    .site-footer a:hover { color: var(--blue); }

    @media (hover: none) {
      .btn-flash:hover, .btn-game:hover, .btn-snake:hover, .btn-balloon:hover { filter: none; }
      .reset-link:hover { color: #9aa7b8; border-color: var(--line); background: rgba(255,255,255,.62); }
    }

    .vip-widget {
      position: sticky;
      top: 20px;
      background: #1d3557;
      color: white;
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .vip-widget::after {
      content: "";
      position: absolute;
      width: 150px; height: 150px;
      right: -54px; top: -58px;
      border-radius: 999px;
      background: rgba(255,209,102,.24);
    }
    .vip-label {
      position: relative;
      z-index: 1;
      font-size: 13px; font-weight: 900; color: #ffd166;
      letter-spacing: .08em; margin-bottom: 8px;
    }
    .vip-title {
      position: relative;
      z-index: 1;
      font-size: 24px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 8px;
    }
    .vip-copy {
      position: relative;
      z-index: 1;
      color: rgba(255,255,255,.76);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 14px;
    }
    .vip-input {
      position: relative;
      z-index: 1;
      width: 100%; padding: 12px 13px; font-size: 18px; font-weight: 900;
      border: 1.5px solid rgba(255,255,255,.28); border-radius: 13px;
      color: white; outline: none; letter-spacing: 4px;
      background: rgba(255,255,255,.12);
      transition: border-color .15s, background .15s;
    }
    .vip-input::placeholder { color: rgba(255,255,255,.52); letter-spacing: 0; font-weight: 700; }
    .vip-input:focus { border-color: #ffd166; background: rgba(255,255,255,.18); }
    .vip-btn {
      position: relative;
      z-index: 1;
      width: 100%; margin-top: 10px;
      padding: 12px; border: none; border-radius: 13px;
      background: #ffd166; color: #1d3557;
      font-size: 15px; font-weight: 900; cursor: pointer;
      transition: filter .15s;
    }
    .vip-btn:hover { filter: brightness(1.08); }
    .vip-msg {
      position: relative;
      z-index: 1;
      font-size: 12px; margin-top: 8px;
      min-height: 16px;
    }
    .vip-switch {
      position: relative;
      z-index: 1;
      width: 100%; margin-top: 8px;
      padding: 9px; border: 1px solid rgba(255,255,255,.24); border-radius: 12px;
      background: transparent; color: rgba(255,255,255,.72);
      font-size: 12px; font-weight: 800; cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .vip-switch:hover { color: white; border-color: rgba(255,255,255,.5); }
    @media (hover: none) {
      .vip-btn:hover { filter: none; }
      .vip-switch:hover { color: rgba(255,255,255,.72); border-color: rgba(255,255,255,.24); }
    }

    @media (max-width: 980px) {
      .app-header { align-items: flex-start; flex-direction: column; }
      .home-layout { grid-template-columns: 1fr; }
      .grades { grid-template-columns: 1fr; }
      .vip-widget { position: relative; top: auto; }
    }

    @media (max-width: 560px) {
      body { padding: 22px 14px 34px; }
      .app-header { margin-bottom: 18px; gap: 14px; }
      .brand-mark { width: 44px; height: 44px; border-radius: 14px; font-size: 22px; }
      .app-sub { font-size: 15px; }
      .grade-card { padding: 18px; border-radius: 20px; }
      .grade-label { font-size: 30px; }
      .bucket-card { padding: 12px; }
      .progress-row { grid-template-columns: 1fr; }
      .prog-item { flex-direction: row; align-items: center; justify-content: space-between; }
      .action-row { grid-template-columns: 1fr 1fr; }
      .btn-flash { grid-column: 1 / -1; justify-content: center; }
      .action-btn { min-height: 48px; }
    }
  </style>
</head>
<body>

<div class="home-shell">
  <header class="app-header">
    <div class="brand-row">
      <div class="brand-mark">J</div>
      <div>
        <div class="app-eyebrow">Junior Vocabulary</div>
        <div class="app-title">JuniorABC</div>
      </div>
    </div>
    <div class="app-sub">先用單字卡建立熟悉度，再用配對、音節與射擊模式把單字練到會用。</div>
  </header>

  <main class="home-layout">
    <section class="grades" id="gradesContainer" aria-label="年級與冊別"></section>

    <aside class="side-rail">
      <div class="vip-widget" id="vipWidget"></div>
      <button class="reset-link" onclick="resetProgress()">重置所有學習進度</button>
    </aside>
  </main>

  <footer class="site-footer">
    <div>荷芯數位工作室</div>
    <div>© 2026 &nbsp;<a href="mailto:service@lotus-core.com.tw">service@lotus-core.com.tw</a></div>
  </footer>
</div>

<script>
const GRADES = [
  {
    id: '7', label: '國一', sub: 'Grade 7',
    desc: '教育部1200 · 會考必備詞彙',
    color: '#4299e1',
    buckets: [{ id: '7.1', label: '上冊' }, { id: '7.2', label: '下冊' }],
    requires: null
  },
  {
    id: '8', label: '國二', sub: 'Grade 8',
    desc: '教育部1200 · 會考必備詞彙',
    color: '#9f7aea',
    buckets: [{ id: '8.1', label: '上冊' }, { id: '8.2', label: '下冊' }],
    requires: '7'
  }
];

function getCookie(name) {
  const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}
const isFlashDone = b => getCookie(`jrabc_flash_${b}`) === 'true';
const isGameDone  = b => getCookie(`jrabc_game_${b}`)  === 'true';

function isGradeDone(id) {
  const g = GRADES.find(x => x.id === id);
  return g && g.buckets.every(b => isFlashDone(b.id) && isGameDone(b.id));
}
function isGradeUnlocked(grade) {
  return true;
}

function renderGrades() {
  const c = document.getElementById('gradesContainer');
  c.innerHTML = '';

  GRADES.forEach(grade => {
    const unlocked = isGradeUnlocked(grade);
    const done     = isGradeDone(grade.id);

    const card = document.createElement('div');
    card.className = 'grade-card' + (unlocked ? '' : ' locked');
    card.style.setProperty('--gc', grade.color);

    if (unlocked) {
      const multiSem = grade.buckets.length > 1;
      const sections = grade.buckets.map((b, i) => `
        <section class="bucket-card">
          <div class="bucket-top">
            ${multiSem ? `<span class="bucket-tag">${b.label}</span>` : ''}
            <span class="bucket-note">建議先完成單字卡</span>
          </div>
          <div class="progress-row">
            <div class="prog-item">
              <span class="prog-label"><span class="prog-dot" id="dot-w-${b.id}"></span>單字</span>
              <span class="seen-ratio" id="r-w-${b.id}">…</span>
            </div>
            <div class="prog-item">
              <span class="prog-label"><span class="prog-dot" id="dot-g-${b.id}"></span>配對</span>
              <span class="seen-ratio" id="r-g-${b.id}">…</span>
            </div>
            <div class="prog-item">
              <span class="prog-label"><span class="prog-dot" id="dot-s-${b.id}"></span>音節</span>
              <span class="seen-ratio" id="r-s-${b.id}">…</span>
            </div>
          </div>
          <div class="action-row">
            <button class="action-btn btn-flash"
                    onclick="go('flashcard/?bucket=${b.id}')">
              <span>單字卡<small>開始 / 繼續</small></span>
            </button>
            <button class="action-btn btn-game"
                    onclick="go('game/?bucket=${b.id}')">配對</button>
            <button class="action-btn btn-snake"
                    onclick="go('snake/?bucket=${b.id}')">音節</button>
            <button class="action-btn btn-balloon"
                    onclick="go('balloon/?bucket=${b.id}')">射擊</button>
          </div>
        </section>`).join('');

      card.innerHTML = `
        <div class="grade-header">
          <div>
            <div class="grade-label">${grade.label}</div>
            <div class="grade-sub">${grade.sub}</div>
            ${grade.desc ? `<div class="grade-desc">${grade.desc}</div>` : ''}
            ${done ? '<span class="grade-done-badge">✓ 已通關</span>' : ''}
          </div>
        </div>
        ${sections}`;
    } else {
      const req = GRADES.find(g => g.id === grade.requires);
      card.innerHTML = `
        <div class="grade-header">
          <div>
            <div class="grade-label">${grade.label}</div>
            <div class="grade-sub">${grade.sub}</div>
            ${grade.desc ? `<div class="grade-desc">${grade.desc}</div>` : ''}
          </div>
          <div class="lock-icon">🔒</div>
        </div>
        <div class="locked-msg">完成「${req.label}」後解鎖</div>`;
    }
    c.appendChild(card);
  });
}

function bestScore(prefix, bucketId) {
  let best = 0;
  for (const diff of ['keep','easy','all']) {
    const s = getCookie(`${prefix}_${bucketId}_${diff}`);
    if (s === null) continue;
    const v = parseFloat(s);
    if (!isNaN(v) && v > best) best = v;
  }
  return best;
}

async function loadBucketStats(bucketId) {
  try {
    const res = await fetch(`flashcard/data/114.${bucketId}.json`);
    if (!res.ok) return null;
    const data = await res.json();
    let customs = {};
    try { customs = JSON.parse(localStorage.getItem(`jrabc_custom_${bucketId}`) || '{}'); }
    catch (_) {}

    let famTotal = 0, famCount = 0;
    let gameMax  = 0; // matching: keep×2 + easy×1
    let snakeMax = 0; // snake: 1 per word
    data.words.forEach(w => {
      const custom = customs[w.word];
      const eff    = custom ?? w.diff;
      if (eff === 'hidden') return;
      gameMax  += (eff === 'keep' ? 2 : 1);
      snakeMax += 1;
      // Familiar scope excludes default-easy words user has never touched
      if (w.diff === 'easy' && !custom) return;
      famTotal++;
      if (eff === 'easy') famCount++;
    });

    return {
      famCount, famTotal,
      gameMax,  gameBest:  bestScore('jrabc_score',       bucketId),
      snakeMax, snakeBest: bestScore('jrabc_snake_score', bucketId),
    };
  } catch (_) {
    return null;
  }
}

function setRatio(textId, dotId, num, den, doneThreshold) {
  const r = document.getElementById(textId);
  const d = document.getElementById(dotId);
  if (!r || !d) return;
  if (den === 0) { r.textContent = '—'; return; }
  const pct = Math.round(num / den * 100);
  // 單字 shows X/Y (Z%); games show Z%
  r.textContent = textId.startsWith('r-w-') ? `${num}/${den} (${pct}%)` : `${pct}%`;
  if (pct >= doneThreshold && num > 0) {
    r.classList.add('done');
    d.classList.add('done');
  }
}

function loadAllRatios() {
  GRADES.forEach(grade => {
    grade.buckets.forEach(b => {
      loadBucketStats(b.id).then(stats => {
        if (!stats) {
          ['r-w-', 'r-g-', 'r-s-'].forEach(p => {
            const el = document.getElementById(p + b.id);
            if (el) el.textContent = '—';
          });
          return;
        }
        setRatio(`r-w-${b.id}`, `dot-w-${b.id}`, stats.famCount,  stats.famTotal,  100);
        setRatio(`r-g-${b.id}`, `dot-g-${b.id}`, stats.gameBest,  stats.gameMax,   60);
        setRatio(`r-s-${b.id}`, `dot-s-${b.id}`, stats.snakeBest, stats.snakeMax,  60);
      });
    });
  });
}

function go(url) { location.href = url; }

function resetProgress() {
  if (!confirm('確定要重置所有學習進度嗎？')) return;
  GRADES.forEach(g => g.buckets.forEach(b => {
    document.cookie = `jrabc_flash_${b.id}=; max-age=0; path=/`;
    document.cookie = `jrabc_game_${b.id}=; max-age=0; path=/`;
    localStorage.removeItem(`jrabc_seen_${b.id}`);
  }));
  renderGrades();
  loadAllRatios();
}

renderGrades();
loadAllRatios();

// ── VIP login ──
// To add a new VIP code: append the 7-digit string to VIP_CODES below.
// See vip-codes.md for the full management log.
const VIP_CODES = [
  '1010609',
];
const VIP_DEST = 'weekly/';

function renderVipWidget() {
  const w = document.getElementById('vipWidget');
  const saved = localStorage.getItem('jrabc_vip');
  if (saved && VIP_CODES.includes(saved)) {
    // Already logged in — show one-tap shortcut, no re-typing required
    w.innerHTML = `
      <div class="vip-label">VIP ${saved}</div>
      <div class="vip-title">本週單字</div>
      <div class="vip-copy">已登入專屬週練習，直接接續目前進度。</div>
      <button class="vip-btn" onclick="location.href='${VIP_DEST}'">進入本週單字</button>
      <button class="vip-switch" onclick="forgetVip()">切換 / 取消 VIP</button>
    `;
  } else {
    w.innerHTML = `
      <div class="vip-label">WEEKLY WORDS</div>
      <div class="vip-title">本週單字</div>
      <div class="vip-copy">輸入 VIP 碼，進入每週專屬單字卡。</div>
      <input type="text" id="vipInput" class="vip-input"
             maxlength="7" inputmode="numeric" placeholder="輸入 7 位數字"
             onkeydown="if(event.key==='Enter')checkVip()">
      <button class="vip-btn" onclick="checkVip()">進入本週單字</button>
      <div class="vip-msg" id="vipMsg"></div>
    `;
  }
}

function forgetVip() {
  localStorage.removeItem('jrabc_vip');
  renderVipWidget();
}

function checkVip() {
  const code = document.getElementById('vipInput').value.trim();
  const msg  = document.getElementById('vipMsg');
  if (!/^\d{7}$/.test(code)) {
    msg.style.color = '#e53e3e';
    msg.textContent = '請輸入 7 位數字。';
    document.getElementById('vipInput').select();
    return;
  }
  if (VIP_CODES.includes(code)) {
    localStorage.setItem('jrabc_vip', code);
    msg.style.color = '#38a169';
    msg.textContent = '登入成功，正在進入。';
    setTimeout(() => { location.href = VIP_DEST; }, 600);
  } else {
    msg.style.color = '#e53e3e';
    msg.textContent = 'VIP 碼不正確。';
    document.getElementById('vipInput').select();
  }
}

renderVipWidget();
</script>
