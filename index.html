<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JuniorABC</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    button:not(:disabled):active { filter: brightness(.92); }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #eef2f7;
      min-height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }

    .app-header { text-align: center; margin-bottom: 44px; }
    .app-title  { font-size: 38px; font-weight: 800; color: #2d3748; letter-spacing: -.5px; }
    .app-sub    { font-size: 18px; color: #718096; margin-top: 6px; }

    .grades {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 22px;
      width: 100%;
      max-width: 960px;
    }

    /* ── Grade card ── */
    .grade-card {
      background: white; border-radius: 22px;
      padding: 26px 26px 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,.07);
      border-left: 6px solid var(--gc, #e2e8f0);
    }
    .grade-card.locked { opacity: .6; border-left-color: #cbd5e0; }

    .grade-header {
      display: flex; align-items: flex-start;
      justify-content: space-between; margin-bottom: 18px;
    }
    .grade-label { font-size: 30px; font-weight: 800; color: #2d3748; line-height: 1; }
    .grade-sub   { font-size: 15px; color: #a0aec0; margin-top: 6px; }
    .grade-desc  { font-size: 12px; color: #b0bec5; margin-top: 4px; letter-spacing: .2px; }
    .grade-done-badge {
      font-size: 14px; font-weight: 700; color: #276749;
      background: #c6f6d5; padding: 4px 12px; border-radius: 20px;
      margin-top: 7px; display: inline-block;
    }
    .lock-icon { font-size: 32px; line-height: 1; margin-top: 2px; }

    /* ── Progress row ── */
    .progress-row {
      display: flex; gap: 20px; margin-bottom: 16px;
      background: #f7fafc; border-radius: 12px; padding: 14px 18px;
    }
    .prog-item { display: flex; align-items: center; gap: 9px; font-size: 15px; color: #718096; }
    .seen-ratio { color: #4299e1; font-weight: 700; margin-left: 4px; }
    .seen-ratio.done { color: #38a169; }
    .prog-dot {
      width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid #e2e8f0; background: white;
      transition: background .3s, border-color .3s;
    }
    .prog-dot.done { background: #68d391; border-color: #48bb78; }

    /* ── Action buttons ── */
    .action-row { display: flex; gap: 12px; }
    .action-btn {
      flex: 1; padding: 18px 10px; border: none; border-radius: 14px;
      font-size: 18px; font-weight: 700; cursor: pointer;
      transition: transform .1s, filter .15s;
    }
    .action-btn:active { transform: scale(.97); }
    .btn-flash { background: #ebf8ff; color: #2b6cb0; }
    .btn-flash:hover { filter: brightness(.95); }
    .btn-game  { background: #f0fff4; color: #276749; }
    .btn-game:hover  { filter: brightness(.95); }
    .btn-snake { background: #faf5ff; color: #553c9a; }
    .btn-snake:hover { filter: brightness(.95); }
    .btn-balloon { background: #fef3c7; color: #92400e; }
    .btn-balloon:hover { filter: brightness(.95); }

    /* ── Bucket sections (multi-semester layout) ── */
    .bucket-tag {
      font-size: 14px; font-weight: 700; color: #718096;
      background: #edf2f7; padding: 4px 11px; border-radius: 12px;
      flex-shrink: 0; align-self: center;
    }
    .bucket-sep { height: 1px; background: #edf2f7; margin: 18px 0; }

    .locked-msg { font-size: 16px; color: #a0aec0; text-align: center; padding: 10px 0 4px; }

    /* ── Reset button ── */
    .reset-link {
      margin-top: 38px; font-size: 15px; color: #cbd5e0;
      background: none; border: 1px solid #e2e8f0; border-radius: 22px;
      cursor: pointer; padding: 12px 22px; min-height: 48px;
      transition: color .15s, border-color .15s;
    }
    .reset-link:hover { color: #fc8181; border-color: #fc8181; }

    /* ── Footer ── */
    .site-footer {
      margin-top: auto; padding-top: 18px;
      border-top: 1px solid #e2e8f0;
      width: 100%; max-width: 960px;
      text-align: center;
      font-size: 13px; color: #a0aec0; line-height: 1.9;
    }
    .site-footer > div:first-child { margin-top: 32px; }
    .site-footer a { color: #a0aec0; text-decoration: none; }
    .site-footer a:hover { color: #4299e1; }

    /* ── Touch-device adjustments: cancel sticky :hover ── */
    @media (hover: none) {
      .btn-flash:hover, .btn-game:hover, .btn-snake:hover, .btn-balloon:hover { filter: none; }
      .reset-link:hover { color: #cbd5e0; border-color: #e2e8f0; }
    }

    /* ── VIP widget (fixed, bottom-right) ── */
    .vip-widget {
      position: fixed; bottom: 20px; right: 16px; z-index: 200;
      background: white; border: 1px solid #e2e8f0; border-radius: 16px;
      padding: 12px 12px 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
      width: 156px;
      max-width: calc(100vw - 32px);
    }
    .vip-label {
      font-size: 11px; font-weight: 700; color: #a0aec0;
      letter-spacing: .4px; margin-bottom: 8px; text-align: center;
    }
    .vip-input {
      width: 100%; padding: 8px 10px; font-size: 16px; font-weight: 700;
      border: 1.5px solid #e2e8f0; border-radius: 9px;
      color: #2d3748; outline: none; letter-spacing: 3px;
      transition: border-color .15s;
    }
    .vip-input:focus { border-color: #90cdf4; }
    .vip-btn {
      width: 100%; margin-top: 8px;
      padding: 9px; border: none; border-radius: 9px;
      background: #4299e1; color: white;
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: filter .15s;
    }
    .vip-btn:hover { filter: brightness(1.08); }
    .vip-msg {
      font-size: 11px; margin-top: 7px;
      text-align: center; min-height: 14px;
    }
    @media (hover: none) { .vip-btn:hover { filter: none; } }
  </style>
</head>
<body>

<div class="app-header">
  <div class="app-title">JuniorABC</div>
  <div class="app-sub">英文單字學習</div>
</div>

<div class="grades" id="gradesContainer"></div>

<button class="reset-link" onclick="resetProgress()">重置所有學習進度</button>

<!-- VIP widget -->
<div class="vip-widget">
  <div class="vip-label">我是爸爸的VIP</div>
  <input type="text" id="vipInput" class="vip-input"
         maxlength="7" inputmode="numeric" placeholder="通關碼"
         onkeydown="if(event.key==='Enter')checkVip()">
  <button class="vip-btn" onclick="checkVip()">登入</button>
  <div class="vip-msg" id="vipMsg"></div>
</div>

<footer class="site-footer">
  <div>荷芯數位工作室</div>
  <div>© 2026 &nbsp;<a href="mailto:service@lotus-core.com.tw">service@lotus-core.com.tw</a></div>
</footer>

<script>
const GRADES = [
  {
    id: '7', label: '國一', sub: 'Grade 7',
    desc: '教育部1200 · 會考必備詞彙',
    color: '#4299e1',
    buckets: [{ id: '7.1', label: '上冊' }, { id: '7.2', label: '下冊' }],
    requires: null
  },
  {
    id: '8', label: '國二', sub: 'Grade 8',
    desc: '教育部1200 · 會考必備詞彙',
    color: '#9f7aea',
    buckets: [{ id: '8.1', label: '上冊' }, { id: '8.2', label: '下冊' }],
    requires: '7'
  }
];

function getCookie(name) {
  const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}
const isFlashDone = b => getCookie(`jrabc_flash_${b}`) === 'true';
const isGameDone  = b => getCookie(`jrabc_game_${b}`)  === 'true';

function isGradeDone(id) {
  const g = GRADES.find(x => x.id === id);
  return g && g.buckets.every(b => isFlashDone(b.id) && isGameDone(b.id));
}
function isGradeUnlocked(grade) {
  return true;
}

function renderGrades() {
  const c = document.getElementById('gradesContainer');
  c.innerHTML = '';

  GRADES.forEach(grade => {
    const unlocked = isGradeUnlocked(grade);
    const done     = isGradeDone(grade.id);

    const card = document.createElement('div');
    card.className = 'grade-card' + (unlocked ? '' : ' locked');
    card.style.setProperty('--gc', grade.color);

    if (unlocked) {
      const multiSem = grade.buckets.length > 1;
      const sections = grade.buckets.map((b, i) => `
        ${i > 0 ? '<div class="bucket-sep"></div>' : ''}
        <div class="progress-row">
          ${multiSem ? `<span class="bucket-tag">${b.label}</span>` : ''}
          <div class="prog-item">
            <div class="prog-dot" id="dot-w-${b.id}"></div>
            <span>單字 <span class="seen-ratio" id="r-w-${b.id}">…</span></span>
          </div>
          <div class="prog-item">
            <div class="prog-dot" id="dot-g-${b.id}"></div>
            <span>配對 <span class="seen-ratio" id="r-g-${b.id}">…</span></span>
          </div>
          <div class="prog-item">
            <div class="prog-dot" id="dot-s-${b.id}"></div>
            <span>音節 <span class="seen-ratio" id="r-s-${b.id}">…</span></span>
          </div>
        </div>
        <div class="action-row">
          <button class="action-btn btn-flash"
                  onclick="go('flashcard/?bucket=${b.id}')">📖 單字卡</button>
          <button class="action-btn btn-game"
                  onclick="go('game/?bucket=${b.id}')">🎮 配對</button>
          <button class="action-btn btn-snake"
                  onclick="go('snake/?bucket=${b.id}')">🐍 音節</button>
          <button class="action-btn btn-balloon"
                  onclick="go('balloon/?bucket=${b.id}')">🎈 射擊</button>
        </div>`).join('');

      card.innerHTML = `
        <div class="grade-header">
          <div>
            <div class="grade-label">${grade.label}</div>
            <div class="grade-sub">${grade.sub}</div>
            ${grade.desc ? `<div class="grade-desc">${grade.desc}</div>` : ''}
            ${done ? '<span class="grade-done-badge">✓ 已通關</span>' : ''}
          </div>
        </div>
        ${sections}`;
    } else {
      const req = GRADES.find(g => g.id === grade.requires);
      card.innerHTML = `
        <div class="grade-header">
          <div>
            <div class="grade-label">${grade.label}</div>
            <div class="grade-sub">${grade.sub}</div>
            ${grade.desc ? `<div class="grade-desc">${grade.desc}</div>` : ''}
          </div>
          <div class="lock-icon">🔒</div>
        </div>
        <div class="locked-msg">完成「${req.label}」後解鎖</div>`;
    }
    c.appendChild(card);
  });
}

function bestScore(prefix, bucketId) {
  let best = 0;
  for (const diff of ['keep','easy','all']) {
    const s = getCookie(`${prefix}_${bucketId}_${diff}`);
    if (s === null) continue;
    const v = parseFloat(s);
    if (!isNaN(v) && v > best) best = v;
  }
  return best;
}

async function loadBucketStats(bucketId) {
  try {
    const res = await fetch(`flashcard/data/114.${bucketId}.json`);
    if (!res.ok) return null;
    const data = await res.json();
    let customs = {};
    try { customs = JSON.parse(localStorage.getItem(`jrabc_custom_${bucketId}`) || '{}'); }
    catch (_) {}

    let famTotal = 0, famCount = 0;
    let gameMax  = 0; // matching: keep×2 + easy×1
    let snakeMax = 0; // snake: 1 per word
    data.words.forEach(w => {
      const custom = customs[w.word];
      const eff    = custom ?? w.diff;
      if (eff === 'hidden') return;
      gameMax  += (eff === 'keep' ? 2 : 1);
      snakeMax += 1;
      // Familiar scope excludes default-easy words user has never touched
      if (w.diff === 'easy' && !custom) return;
      famTotal++;
      if (eff === 'easy') famCount++;
    });

    return {
      famCount, famTotal,
      gameMax,  gameBest:  bestScore('jrabc_score',       bucketId),
      snakeMax, snakeBest: bestScore('jrabc_snake_score', bucketId),
    };
  } catch (_) {
    return null;
  }
}

function setRatio(textId, dotId, num, den, doneThreshold) {
  const r = document.getElementById(textId);
  const d = document.getElementById(dotId);
  if (!r || !d) return;
  if (den === 0) { r.textContent = '—'; return; }
  const pct = Math.round(num / den * 100);
  // 單字 shows X/Y (Z%); games show Z%
  r.textContent = textId.startsWith('r-w-') ? `${num}/${den} (${pct}%)` : `${pct}%`;
  if (pct >= doneThreshold && num > 0) {
    r.classList.add('done');
    d.classList.add('done');
  }
}

function loadAllRatios() {
  GRADES.forEach(grade => {
    grade.buckets.forEach(b => {
      loadBucketStats(b.id).then(stats => {
        if (!stats) {
          ['r-w-', 'r-g-', 'r-s-'].forEach(p => {
            const el = document.getElementById(p + b.id);
            if (el) el.textContent = '—';
          });
          return;
        }
        setRatio(`r-w-${b.id}`, `dot-w-${b.id}`, stats.famCount,  stats.famTotal,  100);
        setRatio(`r-g-${b.id}`, `dot-g-${b.id}`, stats.gameBest,  stats.gameMax,   60);
        setRatio(`r-s-${b.id}`, `dot-s-${b.id}`, stats.snakeBest, stats.snakeMax,  60);
      });
    });
  });
}

function go(url) { location.href = url; }

function resetProgress() {
  if (!confirm('確定要重置所有學習進度嗎？')) return;
  GRADES.forEach(g => g.buckets.forEach(b => {
    document.cookie = `jrabc_flash_${b.id}=; max-age=0; path=/`;
    document.cookie = `jrabc_game_${b.id}=; max-age=0; path=/`;
    localStorage.removeItem(`jrabc_seen_${b.id}`);
  }));
  renderGrades();
  loadAllRatios();
}

renderGrades();
loadAllRatios();

// ── VIP login ──
// To add a new VIP code: append the 7-digit string to VIP_CODES below.
// See vip-codes.md for the full management log.
const VIP_CODES = [
  '1010609',
];
const VIP_DEST = 'weekly/';

function checkVip() {
  const code = document.getElementById('vipInput').value.trim();
  const msg  = document.getElementById('vipMsg');
  if (!/^\d{7}$/.test(code)) {
    msg.style.color = '#e53e3e';
    msg.textContent = '請輸入 7 位數字通關碼。';
    document.getElementById('vipInput').select();
    return;
  }
  if (VIP_CODES.includes(code)) {
    localStorage.setItem('jrabc_vip', code);
    msg.style.color = '#38a169';
    msg.textContent = '歡迎，VIP！';
    setTimeout(() => { location.href = VIP_DEST; }, 600);
  } else {
    msg.style.color = '#e53e3e';
    msg.textContent = '您好，VIP 資料未登錄。';
    document.getElementById('vipInput').select();
  }
}
</script>
</body>
</html>
