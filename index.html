<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JuniorABC</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #eef2f7;
      min-height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }

    .app-header { text-align: center; margin-bottom: 36px; }
    .app-title  { font-size: 28px; font-weight: 800; color: #2d3748; letter-spacing: -.5px; }
    .app-sub    { font-size: 14px; color: #718096; margin-top: 4px; }

    .grades { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 380px; }

    /* ── Grade card ── */
    .grade-card {
      background: white; border-radius: 20px;
      padding: 20px 20px 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,.07);
      border-left: 5px solid var(--gc, #e2e8f0);
    }
    .grade-card.locked { opacity: .6; border-left-color: #cbd5e0; }

    .grade-header {
      display: flex; align-items: flex-start;
      justify-content: space-between; margin-bottom: 14px;
    }
    .grade-label { font-size: 22px; font-weight: 800; color: #2d3748; line-height: 1; }
    .grade-sub   { font-size: 12px; color: #a0aec0; margin-top: 4px; }
    .grade-done-badge {
      font-size: 11px; font-weight: 700; color: #276749;
      background: #c6f6d5; padding: 2px 8px; border-radius: 20px;
      margin-top: 5px; display: inline-block;
    }
    .lock-icon { font-size: 24px; line-height: 1; margin-top: 2px; }

    /* ── Progress row ── */
    .progress-row {
      display: flex; gap: 16px; margin-bottom: 14px;
      background: #f7fafc; border-radius: 12px; padding: 11px 14px;
    }
    .prog-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #718096; }
    .prog-dot {
      width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid #e2e8f0; background: white;
      transition: background .3s, border-color .3s;
    }
    .prog-dot.done { background: #68d391; border-color: #48bb78; }

    /* ── Action buttons ── */
    .action-row { display: flex; gap: 10px; }
    .action-btn {
      flex: 1; padding: 13px 8px; border: none; border-radius: 12px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: transform .1s, filter .15s;
    }
    .action-btn:active { transform: scale(.97); }
    .btn-flash { background: #ebf8ff; color: #2b6cb0; }
    .btn-flash:hover { filter: brightness(.95); }
    .btn-game  { background: #f0fff4; color: #276749; }
    .btn-game:hover  { filter: brightness(.95); }

    .locked-msg { font-size: 13px; color: #a0aec0; text-align: center; padding: 6px 0 2px; }

    /* ── Reset link ── */
    .reset-link {
      margin-top: 32px; font-size: 11px; color: #cbd5e0;
      background: none; border: none; cursor: pointer; text-decoration: underline;
    }
    .reset-link:hover { color: #fc8181; }
  </style>
</head>
<body>

<div class="app-header">
  <div class="app-title">JuniorABC</div>
  <div class="app-sub">英文單字學習</div>
</div>

<div class="grades" id="gradesContainer"></div>

<button class="reset-link" onclick="resetProgress()">重置所有學習進度</button>

<script>
const GRADES = [
  {
    id: '7', label: '國一', sub: 'Grade 7', color: '#4299e1',
    buckets: [{ id: '7.1', label: '上冊' }],
    requires: null
  },
  {
    id: '8', label: '國二', sub: 'Grade 8', color: '#9f7aea',
    buckets: [{ id: '8.2', label: '下冊' }],
    requires: '7'
  }
];

function getCookie(name) {
  const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}
const isFlashDone = b => getCookie(`jrabc_flash_${b}`) === 'true';
const isGameDone  = b => getCookie(`jrabc_game_${b}`)  === 'true';

function isGradeDone(id) {
  const g = GRADES.find(x => x.id === id);
  return g && g.buckets.every(b => isFlashDone(b.id) && isGameDone(b.id));
}
function isGradeUnlocked(grade) {
  return true;
}

function renderGrades() {
  const c = document.getElementById('gradesContainer');
  c.innerHTML = '';

  GRADES.forEach(grade => {
    const unlocked   = isGradeUnlocked(grade);
    const done       = isGradeDone(grade.id);
    const mainBucket = grade.buckets[0].id;

    const card = document.createElement('div');
    card.className = 'grade-card' + (unlocked ? '' : ' locked');
    card.style.setProperty('--gc', grade.color);

    if (unlocked) {
      const dots = grade.buckets.map(b => `
        <div class="prog-item">
          <div class="prog-dot ${isFlashDone(b.id) ? 'done' : ''}"></div>單字卡複習
        </div>
        <div class="prog-item">
          <div class="prog-dot ${isGameDone(b.id) ? 'done' : ''}"></div>遊戲 60%
        </div>`).join('');

      card.innerHTML = `
        <div class="grade-header">
          <div>
            <div class="grade-label">${grade.label}</div>
            <div class="grade-sub">${grade.sub}</div>
            ${done ? '<span class="grade-done-badge">✓ 已通關</span>' : ''}
          </div>
        </div>
        <div class="progress-row">${dots}</div>
        <div class="action-row">
          <button class="action-btn btn-flash"
                  onclick="go('flashcard/?bucket=${mainBucket}')">📖 單字卡</button>
          <button class="action-btn btn-game"
                  onclick="go('game/?bucket=${mainBucket}')">🎮 配對遊戲</button>
        </div>`;
    } else {
      const req = GRADES.find(g => g.id === grade.requires);
      card.innerHTML = `
        <div class="grade-header">
          <div>
            <div class="grade-label">${grade.label}</div>
            <div class="grade-sub">${grade.sub}</div>
          </div>
          <div class="lock-icon">🔒</div>
        </div>
        <div class="locked-msg">完成「${req.label}」後解鎖</div>`;
    }
    c.appendChild(card);
  });
}

function go(url) { location.href = url; }

function resetProgress() {
  if (!confirm('確定要重置所有學習進度嗎？')) return;
  GRADES.forEach(g => g.buckets.forEach(b => {
    document.cookie = `jrabc_flash_${b.id}=; max-age=0; path=/`;
    document.cookie = `jrabc_game_${b.id}=; max-age=0; path=/`;
    localStorage.removeItem(`jrabc_seen_${b.id}`);
  }));
  renderGrades();
}

renderGrades();
</script>
</body>
</html>
