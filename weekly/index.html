<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本週單字 · JuniorABC</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    button:not(:disabled):active { filter: brightness(.92); }
    [hidden] { display: none !important; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #eef2f7;
      min-height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center;
      padding: 16px 20px 60px;
      color: #2d3748;
    }

    /* ── Top bar ── */
    .top-bar {
      width: 100%; max-width: 480px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .back-btn {
      font-size: 14px; color: #4a5568;
      background: white; border: 1px solid #e2e8f0; border-radius: 20px;
      cursor: pointer; padding: 8px 16px; min-height: 38px;
      transition: color .15s, border-color .15s;
    }
    .back-btn:hover { color: #2b6cb0; border-color: #bfdbfe; }
    .logout-btn {
      font-size: 13px; color: #a0aec0;
      background: none; border: 1px solid #e2e8f0; border-radius: 20px;
      cursor: pointer; padding: 7px 14px; min-height: 38px;
      transition: color .15s, border-color .15s;
    }
    .logout-btn:hover { color: #e53e3e; border-color: #fc8181; }

    /* ── Header ── */
    .page-header {
      width: 100%; max-width: 480px;
      margin-bottom: 20px;
    }
    .week-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
    }
    .week-label {
      font-size: 20px; font-weight: 800; color: #2d3748;
    }
    .vip-badge {
      background: #fef3c7; color: #92400e;
      font-size: 12px; font-weight: 700;
      padding: 3px 10px; border-radius: 20px;
    }
    .week-dates {
      font-size: 12px; color: #a0aec0; margin-bottom: 10px;
    }
    .progress-row {
      display: flex; align-items: center; gap: 10px;
    }
    .progress-text {
      font-size: 13px; font-weight: 700; color: #4a5568;
      white-space: nowrap; min-width: 52px;
    }
    .progress-track {
      flex: 1; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: #68d391; border-radius: 4px;
      transition: width .4s ease;
    }

    /* ── Card area ── */
    .card-area {
      width: 100%; max-width: 480px;
      display: flex; flex-direction: column; align-items: center;
      gap: 18px;
    }

    /* ── Flip card ── */
    .card-wrap {
      width: 100%; cursor: pointer;
      perspective: 1200px;
    }
    .card {
      position: relative;
      width: 100%; height: 240px;
      transform-style: preserve-3d;
      transition: transform .45s cubic-bezier(.4,0,.2,1);
      border-radius: 20px;
    }
    .card.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute; inset: 0;
      border-radius: 20px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 28px 24px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: 0 6px 24px rgba(0,0,0,.09);
    }
    .card-front {
      background: white;
    }
    .card-back {
      background: #ebf8ff;
      transform: rotateY(180deg);
    }

    .front-word {
      font-size: 36px; font-weight: 800; color: #2b6cb0;
      text-align: center; letter-spacing: -.5px; line-height: 1.2;
    }
    .front-hint {
      font-size: 13px; color: #cbd5e0; margin-top: 18px;
    }

    .back-syllables {
      font-size: 16px; color: #63b3ed; font-weight: 600;
      letter-spacing: 1px; margin-bottom: 10px;
    }
    .back-zh {
      font-size: 30px; font-weight: 800; color: #2c5282;
      text-align: center; line-height: 1.3;
    }
    .back-audio {
      margin-top: 16px;
      padding: 6px 16px; min-height: 32px;
      border: 1px solid #bee3f8; border-radius: 16px;
      background: rgba(255,255,255,.7); color: #2b6cb0;
      font-size: 13px; font-weight: 700; cursor: pointer;
      transition: background .15s;
    }
    .back-audio:hover { background: rgba(255,255,255,.95); }
    .back-audio.playing { background: #bee3f8; }

    /* ── Counter badge ── */
    .card-counter {
      font-size: 13px; color: #a0aec0; font-weight: 600;
      align-self: flex-end;
    }

    /* ── Action buttons ── */
    .action-row {
      display: flex; gap: 14px; width: 100%;
    }
    .btn-review {
      flex: 1; padding: 16px; border: none; border-radius: 14px;
      background: #fff5f5; color: #c53030;
      font-size: 16px; font-weight: 700; cursor: pointer;
      transition: background .15s;
    }
    .btn-review:hover { background: #fed7d7; }
    .btn-learned {
      flex: 1.4; padding: 16px; border: none; border-radius: 14px;
      background: #f0fff4; color: #276749;
      font-size: 16px; font-weight: 700; cursor: pointer;
      transition: background .15s;
    }
    .btn-learned:hover { background: #c6f6d5; }

    /* ── Round / All-done screen ── */
    .end-screen {
      width: 100%; max-width: 480px;
      background: white; border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 6px 24px rgba(0,0,0,.08);
      text-align: center;
    }
    .end-icon  { font-size: 48px; margin-bottom: 14px; }
    .end-title { font-size: 22px; font-weight: 800; color: #2d3748; margin-bottom: 6px; }
    .end-sub   { font-size: 14px; color: #718096; margin-bottom: 24px; }
    .end-stats {
      display: flex; justify-content: center; gap: 28px;
      margin-bottom: 24px;
    }
    .end-stat { display: flex; flex-direction: column; align-items: center; }
    .end-stat-val  { font-size: 28px; font-weight: 800; color: #2d3748; }
    .end-stat-lbl  { font-size: 12px; color: #a0aec0; margin-top: 2px; }
    .btn-continue {
      width: 100%; padding: 15px; border: none; border-radius: 14px;
      background: #4299e1; color: white;
      font-size: 16px; font-weight: 700; cursor: pointer;
      transition: filter .15s; margin-bottom: 10px;
    }
    .btn-continue:hover { filter: brightness(1.08); }
    .btn-verify {
      width: 100%; padding: 15px; border: none; border-radius: 14px;
      background: linear-gradient(135deg, #f6e05e, #ed8936);
      color: #744210;
      font-size: 16px; font-weight: 800; cursor: pointer;
      transition: filter .15s;
      box-shadow: 0 4px 14px rgba(237,137,54,.35);
    }
    .btn-verify:hover { filter: brightness(1.06); }

    /* ── State box (loading/error/empty) ── */
    .state-box {
      width: 100%; max-width: 480px;
      background: white; border-radius: 20px;
      padding: 48px 28px; text-align: center;
      box-shadow: 0 6px 24px rgba(0,0,0,.06);
    }
    .state-icon  { font-size: 44px; margin-bottom: 14px; }
    .state-title { font-size: 18px; font-weight: 700; color: #2d3748; }
    .state-sub   { font-size: 14px; color: #a0aec0; margin-top: 6px; }

    /* ── Footer ── */
    .site-footer {
      margin-top: auto; padding-top: 18px;
      border-top: 1px solid #e2e8f0;
      width: 100%; max-width: 480px;
      text-align: center;
      font-size: 13px; color: #a0aec0; line-height: 1.9;
    }
    .site-footer > div:first-child { margin-top: 32px; }
    .site-footer a { color: #a0aec0; text-decoration: none; }
    .site-footer a:hover { color: #4299e1; }

    @media (hover: none) {
      .back-btn:hover    { color: #4a5568; border-color: #e2e8f0; }
      .logout-btn:hover  { color: #a0aec0; border-color: #e2e8f0; }
      .btn-review:hover  { background: #fff5f5; }
      .btn-learned:hover { background: #f0fff4; }
      .btn-continue:hover{ filter: none; }
      .btn-verify:hover  { filter: none; }
      .back-audio:hover  { background: rgba(255,255,255,.7); }
    }
  </style>
</head>
<body>

<div class="top-bar">
  <button class="back-btn" onclick="location.href='../'">← 主選單</button>
  <button class="logout-btn" onclick="logout()">取消變身</button>
</div>

<!-- Page header (shown when loaded) -->
<div class="page-header" id="pageHeader" hidden>
  <div class="week-row">
    <span class="week-label" id="weekLabel"></span>
    <span class="vip-badge" id="vipBadge"></span>
  </div>
  <div class="week-dates" id="weekDates"></div>
  <div class="progress-row">
    <span class="progress-text" id="progressText">0 / 0</span>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>
</div>

<!-- Flashcard area -->
<div class="card-area" id="cardArea" hidden>
  <div class="card-counter" id="cardCounter"></div>
  <div class="card-wrap" onclick="flipCard()">
    <div class="card" id="card">
      <div class="card-face card-front" id="cardFront">
        <div class="front-word" id="frontWord"></div>
        <div class="front-hint">點擊卡片翻面</div>
      </div>
      <div class="card-face card-back" id="cardBack">
        <div class="back-syllables" id="backSyllables"></div>
        <div class="back-zh" id="backZh"></div>
        <button class="back-audio" id="audioBtn"
                onclick="event.stopPropagation(); speakCurrent()">🔊 聽</button>
      </div>
    </div>
  </div>
  <div class="action-row" id="actionRow" hidden>
    <button class="btn-review"  onclick="markReview()">再複習</button>
    <button class="btn-learned" onclick="markLearned()">會了 ✓</button>
  </div>
</div>

<!-- End / all-done screen -->
<div class="end-screen" id="endScreen" hidden>
  <div class="end-icon"  id="endIcon"></div>
  <div class="end-title" id="endTitle"></div>
  <div class="end-sub"   id="endSub"></div>
  <div class="end-stats" id="endStats"></div>
  <button class="btn-continue" id="btnContinue" hidden onclick="continueReview()"></button>
  <button class="btn-verify"   id="btnVerify"   hidden onclick="doVerify()">🎖 我要驗牌！</button>
</div>

<!-- Loading / error / empty -->
<div class="state-box" id="stateBox">
  <div class="state-icon">⏳</div>
  <div class="state-title">載入中…</div>
</div>

<footer class="site-footer">
  <div>荷芯數位工作室</div>
  <div>© 2026 &nbsp;<a href="mailto:service@lotus-core.com.tw">service@lotus-core.com.tw</a></div>
</footer>

<script>
const vipCode = localStorage.getItem('jrabc_vip');
if (!vipCode) { location.replace('../'); throw new Error('no_vip'); }

// ── State ──
let deck       = [];        // {word, zh, syllables, idx}[]
let queue      = [];        // indices in current study queue
let queuePos   = 0;
let learned    = new Set(); // indices marked 會了
let isFlipped  = false;
let currentFile = '';
let nextFile    = '';
let totalWords  = 0;
let currentAudio = null;

function saveKey() { return `jrabc_weekly_${vipCode}_${currentFile}`; }

function saveProgress() {
  localStorage.setItem(saveKey(), JSON.stringify({ learned: [...learned] }));
}
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(saveKey()) || '{"learned":[]}'); }
  catch(_) { return { learned: [] }; }
}

// ── Boot ──
async function loadWeekly() {
  const box = document.getElementById('stateBox');
  try {
    const idxRes = await fetch(`data/${vipCode}.json`);
    if (!idxRes.ok) throw new Error('no_index');
    const idx = await idxRes.json();
    if (!idx.current) throw new Error('no_current');
    currentFile = idx.current;
    nextFile    = idx.next || '';

    const dataRes = await fetch(`data/${currentFile}`);
    if (!dataRes.ok) throw new Error('not_found');
    const data = await dataRes.json();

    document.getElementById('weekLabel').textContent = data.week || '本週單字';
    document.getElementById('vipBadge').textContent  = data.name || 'VIP';
    document.getElementById('weekDates').textContent =
      (data.start && data.end) ? `${data.start} ～ ${data.end}` : '';

    initDeck(data.words || []);
    box.hidden = true;
    document.getElementById('pageHeader').hidden = false;
  } catch(e) {
    if (e.message === 'not_found' || e.message === 'no_current') {
      box.innerHTML = `<div class="state-icon">📭</div>
        <div class="state-title">本週單字尚未發佈</div>
        <div class="state-sub">請稍後再回來查看</div>`;
    } else {
      box.innerHTML = `<div class="state-icon">⚠️</div>
        <div class="state-title">載入失敗</div>
        <div class="state-sub">請重新整理頁面</div>`;
    }
  }
}

function initDeck(words) {
  if (words.length === 0) {
    document.getElementById('stateBox').hidden = false;
    document.getElementById('stateBox').innerHTML = `<div class="state-icon">📝</div>
      <div class="state-title">本週單字清單是空的</div>
      <div class="state-sub">請等候爸爸更新</div>`;
    return;
  }

  deck = words.map((w, i) => ({ ...w, idx: i }));
  totalWords = deck.length;

  const saved = loadProgress();
  learned = new Set(saved.learned.filter(i => i < totalWords));

  // Queue = unlearned cards in order
  queue = deck.filter(w => !learned.has(w.idx)).map(w => w.idx);

  updateHeader();

  if (queue.length === 0) { showAllDone(); return; }

  queuePos = 0;
  document.getElementById('cardArea').hidden = false;
  showCard();
}

// ── Card display ──
function showCard() {
  isFlipped = false;
  const card = document.getElementById('card');
  card.classList.remove('flipped');
  document.getElementById('actionRow').hidden = true;
  document.getElementById('audioBtn').classList.remove('playing');
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();

  const w = deck[queue[queuePos]];
  document.getElementById('frontWord').textContent    = w.word;
  document.getElementById('backSyllables').textContent = w.syllables || '';
  document.getElementById('backSyllables').hidden      = !w.syllables;
  document.getElementById('backZh').textContent       = w.zh;

  const remaining = queue.length - queuePos;
  document.getElementById('cardCounter').textContent =
    `剩餘 ${remaining} 張　（已學會 ${learned.size} / ${totalWords}）`;
}

function flipCard() {
  if (isFlipped) return;
  isFlipped = true;
  document.getElementById('card').classList.add('flipped');
  setTimeout(() => {
    document.getElementById('actionRow').hidden = false;
  }, 250);
}

function advance() {
  queuePos++;
  updateHeader();
  if (queuePos >= queue.length) {
    showRoundEnd();
    return;
  }
  // Brief pause before next card
  document.getElementById('cardArea').hidden = true;
  setTimeout(() => {
    document.getElementById('cardArea').hidden = false;
    showCard();
  }, 180);
}

function markLearned() {
  learned.add(queue[queuePos]);
  saveProgress();
  advance();
}

function markReview() {
  // Keep in queue but push to end
  const idx = queue[queuePos];
  queue.splice(queuePos, 1);
  queue.push(idx);
  updateHeader();
  // Don't increment queuePos (next card slides in)
  document.getElementById('cardArea').hidden = true;
  setTimeout(() => {
    document.getElementById('cardArea').hidden = false;
    showCard();
  }, 180);
}

// ── Progress ──
function updateHeader() {
  const pct = totalWords ? Math.round(learned.size / totalWords * 100) : 0;
  document.getElementById('progressText').textContent = `${learned.size} / ${totalWords}`;
  document.getElementById('progressFill').style.width = `${pct}%`;
}

// ── End screens ──
function showRoundEnd() {
  document.getElementById('cardArea').hidden = true;
  const reviewCount = totalWords - learned.size;
  const s = document.getElementById('endScreen');

  if (learned.size === totalWords) { showAllDone(); return; }

  document.getElementById('endIcon').textContent  = '📖';
  document.getElementById('endTitle').textContent = '這輪練習完成！';
  document.getElementById('endSub').textContent   = `還有 ${reviewCount} 個單字需要繼續加油`;
  document.getElementById('endStats').innerHTML   = `
    <div class="end-stat">
      <div class="end-stat-val" style="color:#68d391">${learned.size}</div>
      <div class="end-stat-lbl">已學會</div>
    </div>
    <div class="end-stat">
      <div class="end-stat-val" style="color:#fc8181">${reviewCount}</div>
      <div class="end-stat-lbl">再複習</div>
    </div>`;
  const btnC = document.getElementById('btnContinue');
  btnC.textContent = `繼續複習（${reviewCount} 張）`;
  btnC.hidden = false;
  document.getElementById('btnVerify').hidden = true;
  s.hidden = false;
}

function showAllDone() {
  document.getElementById('cardArea').hidden = true;
  const s = document.getElementById('endScreen');
  document.getElementById('endIcon').textContent  = '🎉';
  document.getElementById('endTitle').textContent = '本週單字全部學完！';
  document.getElementById('endSub').textContent   = `恭喜完成 ${totalWords} 個單字`;
  document.getElementById('endStats').innerHTML   = `
    <div class="end-stat">
      <div class="end-stat-val" style="color:#68d391">${totalWords}</div>
      <div class="end-stat-lbl">全部學會</div>
    </div>`;
  document.getElementById('btnContinue').hidden = true;
  const btnV = document.getElementById('btnVerify');
  btnV.hidden = !nextFile;   // only show if next week exists
  s.hidden = false;
}

function continueReview() {
  // Rebuild queue from unlearned cards
  queue = deck.filter(w => !learned.has(w.idx)).map(w => w.idx);
  queuePos = 0;
  document.getElementById('endScreen').hidden = true;
  document.getElementById('cardArea').hidden  = false;
  showCard();
}

async function doVerify() {
  if (!nextFile) return;
  const box = document.getElementById('stateBox');
  document.getElementById('endScreen').hidden = true;
  box.innerHTML = `<div class="state-icon">⏳</div><div class="state-title">載入下週單字…</div>`;
  box.hidden = false;
  try {
    const res = await fetch(`data/${nextFile}`);
    if (!res.ok) throw new Error();
    const data = await res.json();
    renderVerifyList(data);
    box.hidden = true;
  } catch(_) {
    box.innerHTML = `<div class="state-icon">📭</div>
      <div class="state-title">下週單字尚未發佈</div>
      <div class="state-sub">爸爸還沒準備好，再等等喔</div>`;
  }
}

function renderVerifyList(data) {
  const area = document.getElementById('cardArea');
  area.innerHTML = `
    <div style="width:100%;text-align:center;margin-bottom:18px;">
      <div style="font-size:18px;font-weight:800;color:#2d3748">
        🔍 偷看 ${data.week || '下週單字'}
      </div>
      <div style="font-size:12px;color:#a0aec0;margin-top:4px">
        ${data.start || ''} ～ ${data.end || ''}
      </div>
    </div>
    ${(data.words || []).map(w => `
      <div style="background:white;border-radius:14px;padding:14px 18px;
                  width:100%;box-shadow:0 2px 8px rgba(0,0,0,.06);
                  display:flex;justify-content:space-between;align-items:center;
                  margin-bottom:10px;">
        <div>
          <div style="font-size:17px;font-weight:700;color:#2b6cb0">${escHtml(w.word)}</div>
          ${w.syllables ? `<div style="font-size:12px;color:#90cdf4">${escHtml(w.syllables)}</div>` : ''}
        </div>
        <div style="font-size:15px;color:#4a5568;font-weight:600">${escHtml(w.zh)}</div>
      </div>`).join('')}`;
  area.hidden = false;
}

// ── Audio ──
function speakCurrent() {
  const w = deck[queue[queuePos]];
  if (!w) return;
  speak(document.getElementById('audioBtn'), w.word);
}

async function speak(btn, word) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  btn.classList.add('playing');
  try {
    const ctrl = new AbortController();
    const tid = setTimeout(() => ctrl.abort(), 3000);
    const res = await fetch(
      `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`,
      { signal: ctrl.signal }
    );
    clearTimeout(tid);
    if (res.ok) {
      const data = await res.json();
      const phon = data[0]?.phonetics ?? [];
      const url = (phon.find(p => p.audio?.includes('-us')) ?? phon.find(p => p.audio?.trim()))?.audio;
      if (url) {
        const audio = new Audio(url);
        currentAudio = audio;
        audio.onended = audio.onerror = () => { btn.classList.remove('playing'); currentAudio = null; };
        audio.play(); return;
      }
    }
  } catch(_) {}
  if ('speechSynthesis' in window) {
    const utt = new SpeechSynthesisUtterance(word);
    utt.lang = 'en-US'; utt.rate = 0.85;
    utt.onend = utt.onerror = () => btn.classList.remove('playing');
    setTimeout(() => btn.classList.remove('playing'), 6000);
    speechSynthesis.speak(utt);
  } else { btn.classList.remove('playing'); }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Auth ──
function logout() {
  if (confirm('確定要取消變身？')) {
    localStorage.removeItem('jrabc_vip');
    location.href = '../';
  }
}

if (vipCode) loadWeekly();
</script>
</body>
</html>
